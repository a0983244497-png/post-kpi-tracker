<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>我的課程</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
    --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-100); color: var(--gray-900); min-height: 100vh; }
  .topbar { background: var(--primary); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .topbar h1 { font-size: 1rem; font-weight: 700; }
  .topbar .who { font-size: .78rem; opacity: .85; }
  .logout-btn { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: .78rem; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .logout-btn:hover { background: rgba(255,255,255,.28); }

  .content { padding: 16px; max-width: 1360px; margin: 0 auto; }
  .series-section { margin-bottom: 20px; }
  .series-heading { font-size: .8rem; font-weight: 700; color: var(--gray-500); letter-spacing: .04em; margin-bottom: 8px; padding-left: 2px; }
  .pdf-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; transition: box-shadow .15s; }
  .pdf-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.14); }
  .pdf-title { font-weight: 600; font-size: .95rem; }
  .pdf-arrow { color: var(--gray-500); font-size: 1.1rem; }
  .pdf-card.done .pdf-title { color: var(--gray-700); }
  .done-mark { color: #16a34a; font-weight: 800; margin-right: 6px; }

  /* 觀看進度 */
  .pbar { height: 6px; background: var(--gray-200); border-radius: 999px; overflow: hidden; }
  .pbar > span { display: block; height: 100%; background: #16a34a; border-radius: 999px; transition: width .3s; }
  .overall { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 20px; }
  .overall-text { font-size: .88rem; font-weight: 700; margin-bottom: 8px; }
  .overall .pbar { height: 10px; }
  .series-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding-left: 2px; }
  .series-progress .pbar { flex: 1; max-width: 320px; }
  .series-progress-text { font-size: .75rem; color: var(--gray-500); white-space: nowrap; }

  /* 每週打卡：一題 + 心情分數，不用打字 */
  .checkin { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin: 0 0 14px; }
  .checkin-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .checkin-title { font-size: .92rem; font-weight: 700; }
  .checkin-streak { font-size: .75rem; color: var(--gray-500); white-space: nowrap; }
  .checkin-q { font-size: .85rem; color: var(--gray-700); margin: 6px 0; }
  .choice-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .choice { border: 1px solid var(--gray-200); background: var(--gray-50); border-radius: 8px; padding: 8px 14px; font-size: .86rem; cursor: pointer; color: var(--gray-900); }
  .choice.mood { min-width: 42px; text-align: center; padding: 8px 0; }
  .choice.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
  .mood-ends { font-size: .75rem; color: var(--gray-500); align-self: center; }
  .checkin-submit { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: .86rem; font-weight: 700; cursor: pointer; }
  .checkin-submit:disabled { opacity: .45; cursor: not-allowed; }
  .checkin-done { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .88rem; }
  .checkin-done b { color: #16a34a; }
  .link-btn { background: none; border: none; color: var(--primary); font-weight: 700; font-size: .82rem; cursor: pointer; white-space: nowrap; }

  /* 繼續學習 */
  .next-up { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: var(--shadow); }
  .next-up small { display: block; font-size: .75rem; opacity: .85; margin-bottom: 4px; }
  .next-up b { font-size: 1rem; }
  .next-up button { background: #fff; color: var(--primary-dark); border: none; border-radius: 8px; padding: 10px 16px; font-size: .88rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .next-up.all-done { background: #16a34a; }

  /* 系列卡片 */
  .series-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .series-card { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; cursor: pointer; border: 2px solid transparent; text-align: left; font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .series-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.14); }
  .series-card.open { border-color: var(--primary); }
  .series-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-weight: 700; font-size: .95rem; }
  .series-card-meta { font-size: .75rem; color: var(--gray-500); margin-top: 8px; }
  .badge-new { background: #ef4444; color: #fff; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge-done { color: #16a34a; font-size: .8rem; }
  #series-detail { scroll-margin-top: 72px; }
  .series-card.soon { cursor: default; border: 2px dashed var(--gray-200); background: var(--gray-50); }
  .series-card.soon:hover { box-shadow: var(--shadow); }
  .badge-soon { background: var(--gray-200); color: var(--gray-700); font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--gray-500); }
  .empty-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .loading { text-align: center; padding: 40px; color: var(--gray-500); font-size: .88rem; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>我的課程</h1>
    <div class="who" id="who-line"></div>
  </div>
  <button class="logout-btn" onclick="doLogout()">登出</button>
</div>

<div class="content">
  <div id="checkin" class="checkin" style="display:none"></div>
  <div id="list" class="loading">載入中…</div>
</div>

<script>
  const qs = sel => document.querySelector(sel);

  async function init() {
    try {
      const me = await api('/api/course/me');
      qs('#who-line').textContent = me.name + '（' + me.email + '）';
    } catch (e) {
      location.href = '/course-login.html';
      return;
    }
    loadCheckin();
    await loadPdfs();
  }

  // ── 每週打卡（週一換週，同週再送 = 修改）──
  const PLAN_LABELS = { yes: '有', no: '沒有', no_trade: '這週沒做單' };
  const PLAN_DONE_TEXT = { yes: '有照計畫', no: '沒有照計畫', no_trade: '這週沒做單' };
  let checkinData = null;
  let checkinDraft = { followed_plan: null, mood: null };
  let checkinEditing = false;

  async function loadCheckin() {
    try {
      checkinData = await api('/api/course/checkin/current');
      checkinEditing = !checkinData.checkin;
      checkinDraft = { ...(checkinData.checkin || { followed_plan: null, mood: null }) };
      renderCheckin();
    } catch (e) {
      // 打卡載入失敗不影響看課
    }
  }

  function weekRangeText(weekStart) {
    const d = new Date(weekStart + 'T00:00:00');
    const e = new Date(d); e.setDate(d.getDate() + 6);
    const f = x => `${x.getMonth() + 1}/${x.getDate()}`;
    return `${f(d)}–${f(e)}`;
  }

  function renderCheckin() {
    const el = qs('#checkin');
    const streak = checkinData.streak ? `已連續打卡 ${checkinData.streak} 週` : '';
    const head = `<div class="checkin-head"><span class="checkin-title">本週打卡（${weekRangeText(checkinData.week_start)}）</span><span class="checkin-streak">${streak}</span></div>`;

    if (!checkinEditing && checkinData.checkin) {
      const c = checkinData.checkin;
      el.innerHTML = `<div class="checkin-done"><span><b>✓ 本週已打卡</b>（${PLAN_DONE_TEXT[c.followed_plan]}・心情 ${c.mood}）${streak ? '　' + streak : ''}</span>
        <button class="link-btn" onclick="editCheckin()">修改</button></div>`;
      el.style.display = '';
      return;
    }

    const planBtns = Object.entries(PLAN_LABELS).map(([k, label]) =>
      `<button class="choice ${checkinDraft.followed_plan === k ? 'on' : ''}" onclick="pickPlan('${k}')">${label}</button>`).join('');
    const moodBtns = [1, 2, 3, 4, 5].map(n =>
      `<button class="choice mood ${checkinDraft.mood === n ? 'on' : ''}" onclick="pickMood(${n})">${n}</button>`).join('');
    const ready = checkinDraft.followed_plan && checkinDraft.mood;
    el.innerHTML = head + `
      <div class="checkin-q">這週有照計畫做單嗎？</div>
      <div class="choice-row">${planBtns}</div>
      <div class="checkin-q">這週心情？</div>
      <div class="choice-row"><span class="mood-ends">😣</span>${moodBtns}<span class="mood-ends">😄</span></div>
      <button class="checkin-submit" ${ready ? '' : 'disabled'} onclick="submitCheckin()">送出</button>`;
    el.style.display = '';
  }

  function pickPlan(k) { checkinDraft.followed_plan = k; renderCheckin(); }
  function pickMood(n) { checkinDraft.mood = n; renderCheckin(); }
  function editCheckin() { checkinEditing = true; renderCheckin(); }

  async function submitCheckin() {
    try {
      checkinData = await api('/api/course/checkin/current', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(checkinDraft),
      });
      checkinEditing = false;
      renderCheckin();
    } catch (e) {
      alert('送出失敗：' + e.message);
    }
  }

  async function api(path, opts = {}) {
    const r = await fetch(path, { credentials: 'same-origin', ...opts });
    if (!r.ok) {
      if (r.status === 401) { location.href = '/course-login.html'; }
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error || String(r.status));
    }
    return r.json();
  }

  async function loadPdfs() {
    const listEl = qs('#list');
    try {
      const [pdfs, progress] = await Promise.all([
        api('/api/course/my-pdfs'),
        api('/api/course/progress').catch(() => ({ pdf_ids: [] })),
      ]);
      const doneSet = new Set(progress.pdf_ids || []);
      if (!pdfs.length) {
        listEl.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>目前尚未開通任何課程<br>請聯繫管理員開通權限</div>';
        return;
      }

      // 依系列分組（後端已依系列排序，未分類排最後）
      const groups = {};
      const order = [];
      for (const p of pdfs) {
        const key = p.series_id ?? 'none';
        if (!groups[key]) { groups[key] = { name: p.series_name || '未分類', items: [] }; order.push(key); }
        groups[key].items.push(p);
      }

      // 進度只算目前可看的篇數（X = 已看完且可看、Y = 可看總數）
      const totalDone = pdfs.filter(p => doneSet.has(p.id)).length;
      const overall = `<div class="overall">
        <div class="overall-text">總共 ${totalDone} / ${pdfs.length} 篇已看完（${pct(totalDone, pdfs.length)}%）</div>
        <div class="pbar"><span style="width:${pct(totalDone, pdfs.length)}%"></span></div>
      </div>`;

      // 繼續學習：依閱讀順序找第一篇還沒看完的
      const next = pdfs.find(p => !doneSet.has(p.id));
      const nextUp = next
        ? `<div class="next-up"><div><small>▶ 繼續學習</small><b>${esc(next.series_name || '')}${next.series_name ? '｜' : ''}${esc(next.title)}</b></div><button onclick="openPdf(${next.id})">開始看</button></div>`
        : `<div class="next-up all-done"><div><small>🎉 太強了</small><b>目前開通的課程全部看完了</b></div></div>`;

      // 預設展開：上次點開的系列 → 下一篇所在系列 → 第一個系列
      let saved = null;
      try { saved = localStorage.getItem('course_open_series'); } catch (e) {}
      const nextKey = next ? String(next.series_id ?? 'none') : null;
      courseState.groups = groups;
      courseState.doneSet = doneSet;
      courseState.openKey = order.map(String).includes(saved) ? saved : (nextKey || String(order[0]));

      const cards = order.map(key => {
        const g = groups[key];
        const done = g.items.filter(p => doneSet.has(p.id)).length;
        const isNew = NEW_SERIES.includes(g.name) && done === 0;
        const badge = isNew ? '<span class="badge-new">NEW</span>'
          : (done === g.items.length ? '<span class="badge-done">✓ 完成</span>' : '');
        return `<button class="series-card" data-key="${esc(String(key))}" onclick="openSeries(this.dataset.key)">
          <div class="series-card-head"><span>${esc(g.name)}</span>${badge}</div>
          <div class="pbar"><span style="width:${pct(done, g.items.length)}%"></span></div>
          <div class="series-card-meta">${done} / ${g.items.length} 已看完・${pct(done, g.items.length)}%</div>
        </button>`;
      }).join('') + COMING_SOON
        .filter(c => !order.some(k => groups[k].name === c.name))
        .map(c => `<div class="series-card soon">
          <div class="series-card-head"><span>${esc(c.name)}</span><span class="badge-soon">即將上線</span></div>
          <div class="pbar"><span style="width:0%"></span></div>
          <div class="series-card-meta">共 ${c.count} 篇・敬請期待</div>
        </div>`).join('');

      listEl.className = '';
      listEl.innerHTML = nextUp + overall
        + `<div class="series-grid">${cards}</div>`
        + `<div id="series-detail"></div>`;
      renderSeriesDetail();
    } catch (e) {
      listEl.innerHTML = `<div class="empty">載入失敗：${esc(e.message)}</div>`;
    }
  }

  // 新上架的系列（學員還沒開始看時顯示 NEW）
  const NEW_SERIES = ['總經系列'];
  // 預告中的系列：後台還沒上架時顯示「即將上線」卡片，上架後自動換成正式卡片
  const COMING_SOON = [{ name: '總經系列', count: 10 }];
  const courseState = { groups: {}, doneSet: new Set(), openKey: null };

  function openSeries(key) {
    courseState.openKey = key;
    try { localStorage.setItem('course_open_series', key); } catch (e) {}
    renderSeriesDetail();
    qs('#series-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderSeriesDetail() {
    const { groups, doneSet, openKey } = courseState;
    document.querySelectorAll('.series-card').forEach(c => c.classList.toggle('open', c.dataset.key === openKey));
    const g = groups[openKey];
    const el = qs('#series-detail');
    if (!g || !el) return;
    el.innerHTML = `<div class="series-section">
      <div class="series-heading">${esc(g.name)}</div>
      ${g.items.map(p => {
        const isDone = doneSet.has(p.id);
        return `<div class="pdf-card${isDone ? ' done' : ''}" onclick="openPdf(${p.id})"><span class="pdf-title">${isDone ? '<span class="done-mark" title="已看完">✓</span>' : ''}${esc(p.title)}</span><span class="pdf-arrow">›</span></div>`;
      }).join('')}
    </div>`;
  }

  function pct(done, total) {
    return total ? Math.round(done / total * 100) : 0;
  }

  function openPdf(id) {
    location.href = '/course-reader.html?id=' + encodeURIComponent(id);
  }

  async function doLogout() {
    await fetch('/api/course/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
    location.href = '/course-login.html';
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
