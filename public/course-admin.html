<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>課程管理後台</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --mgr: #7c3aed;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
    --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-100); color: var(--gray-900); min-height: 100vh; }

  .topbar { background: var(--mgr); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .topbar h1 { font-size: 1rem; font-weight: 700; }
  .logout-btn { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: .78rem; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .logout-btn:hover { background: rgba(255,255,255,.28); }

  .content { padding: 16px; max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .card h2 { font-size: .92rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .card .badge { font-size: .68rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--danger); color: #fff; }

  textarea { width: 100%; min-height: 100px; padding: 10px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: .85rem; background: var(--gray-50); font-family: inherit; resize: vertical; margin-bottom: 8px; }
  input[type=text], input[type=email], select { padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: .85rem; background: var(--gray-50); }
  input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: .92rem; background: var(--gray-50); }

  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; border: none; border-radius: 8px; font-size: .85rem; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger  { background: var(--danger);  color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: .78rem; }
  .btn-ghost { background: var(--gray-100); color: var(--gray-700); }

  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
  th { color: var(--gray-500); font-weight: 600; font-size: .75rem; white-space: nowrap; }
  .row-actions { display: flex; gap: 6px; }

  .status-pill { padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; display: inline-block; }
  .status-active   { background: #d1fae5; color: #065f46; }
  .status-disabled { background: var(--gray-100); color: var(--gray-500); }
  .status-pending  { background: #fef3c7; color: #92400e; }
  .status-approved { background: #d1fae5; color: #065f46; }
  .status-rejected { background: #fee2e2; color: #991b1b; }

  .msg { font-size: .8rem; margin-top: 6px; }
  .msg.ok  { color: var(--success); }
  .msg.err { color: var(--danger); }
  .muted { color: var(--gray-500); font-size: .82rem; }

  .access-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

  /* 系列分組 */
  .series-group { border: 1px solid var(--gray-200); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .series-group-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--gray-50); font-weight: 700; font-size: .85rem; }
  .series-group-body { padding: 2px 10px; }
  .pdf-toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: .85rem; border-bottom: 1px solid var(--gray-100); gap: 10px; }
  .pdf-toggle-row:last-child { border-bottom: none; }
  .pdf-toggle-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 開關 */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: var(--gray-200); border-radius: 999px; cursor: pointer; transition: background .15s; }
  .switch .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .switch input:checked + .slider { background: var(--success); }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  /* 依學員 / 依系列 分頁籤 */
  .access-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .access-tab { padding: 7px 14px; border: 1px solid var(--gray-200); background: var(--gray-50); border-radius: 8px; font-size: .82rem; font-weight: 700; cursor: pointer; color: var(--gray-700); }
  .access-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .access-student-results { max-height: 200px; overflow-y: auto; border: 1px solid var(--gray-200); border-radius: 8px; margin: 8px 0; }
  .access-student-row { padding: 8px 10px; font-size: .85rem; cursor: pointer; border-bottom: 1px solid var(--gray-100); }
  .access-student-row:last-child { border-bottom: none; }
  .access-student-row:hover { background: var(--gray-100); }
  .access-student-name { font-weight: 700; font-size: .9rem; margin: 10px 0 6px; }

  /* Manager login modal */
  #modal-mgr { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  #modal-mgr .box { background: #fff; border-radius: var(--radius); padding: 24px 20px; max-width: 320px; width: 100%; }
  #modal-mgr h2 { font-size: 1rem; margin-bottom: 14px; }
</style>
</head>
<body>

<div id="modal-mgr">
  <div class="box">
    <h2>課程管理後台</h2>
    <input id="mgr-pw" type="password" placeholder="主管密碼" autocomplete="current-password">
    <div id="mgr-err" class="msg err" style="display:none"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="submitMgrLogin()">登入</button>
  </div>
</div>

<div id="modal-student-edit" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:1000;padding:20px">
  <div style="background:#fff;border-radius:var(--radius);padding:24px 20px;max-width:340px;width:100%">
    <h2 style="font-size:1rem;margin-bottom:14px">編輯學員</h2>
    <label class="muted" style="display:block;margin-bottom:3px">姓名</label>
    <input type="text" id="edit-student-name" style="width:100%;margin-bottom:10px">
    <label class="muted" style="display:block;margin-bottom:3px">Email</label>
    <input type="email" id="edit-student-email" style="width:100%;margin-bottom:10px">
    <label class="muted" style="display:block;margin-bottom:3px">TradingView 名稱</label>
    <input type="text" id="edit-student-tv" style="width:100%;margin-bottom:10px">
    <div id="edit-student-msg" class="msg err" style="display:none"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn btn-primary" style="flex:1" onclick="saveStudentEdit()">存檔</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeStudentEdit()">取消</button>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <h1>課程管理後台</h1>
    <button class="logout-btn" onclick="exitMgr()">登出</button>
  </div>

  <div class="content">
    <!-- 名單匯入 -->
    <div class="card">
      <h2>📋 名單匯入</h2>
      <p class="muted" style="margin-bottom:8px">每行格式：姓名,email,TradingView名稱</p>
      <textarea id="import-csv" placeholder="王小明,ming@example.com,MingTrader&#10;陳小美,mei@example.com,MeiFX"></textarea>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="file" id="import-file" accept=".csv,text/csv,text/plain" onchange="handleFileUpload()">
        <button class="btn btn-primary" onclick="submitImport()">匯入</button>
      </div>
      <div id="import-msg" class="msg" style="display:none"></div>
    </div>

    <!-- 待審核申請 -->
    <div class="card">
      <h2>🕐 待審核申請 <span id="pending-badge" class="badge" style="display:none">0</span></h2>
      <div id="applications-list" class="muted">載入中…</div>
    </div>

    <!-- 學員列表 -->
    <div class="card">
      <h2 id="students-title">👥 學員列表</h2>
      <div style="margin-bottom:10px">
        <input type="text" id="students-search" placeholder="搜尋姓名或 email…" style="width:100%">
      </div>
      <div id="students-list" class="muted">載入中…</div>
      <div id="students-pager" style="display:none;align-items:center;justify-content:center;gap:12px;margin-top:12px">
        <button class="btn btn-ghost btn-sm" id="students-prev" onclick="changeStudentPage(-1)">上一頁</button>
        <span class="muted" id="students-pageinfo"></span>
        <button class="btn btn-ghost btn-sm" id="students-next" onclick="changeStudentPage(1)">下一頁</button>
      </div>
    </div>

    <!-- PDF 管理 -->
    <div class="card">
      <h2>📄 PDF 管理</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <input type="text" id="pdf-title" placeholder="PDF 標題" style="flex:1;min-width:160px">
        <select id="pdf-series-select"><option value="">未分類</option></select>
        <input type="number" id="pdf-episode-no" placeholder="篇號" style="width:70px" min="0">
        <input type="file" id="pdf-file" accept="application/pdf">
        <button class="btn btn-primary btn-sm" onclick="uploadPdf()">上傳</button>
      </div>
      <div id="pdf-upload-msg" class="msg" style="display:none"></div>

      <div class="access-row" style="margin-top:4px">
        <input type="text" id="new-series-name" placeholder="新增系列名稱">
        <button class="btn btn-ghost btn-sm" onclick="createSeries()">＋ 新增系列</button>
      </div>

      <div id="pdf-manage-list" class="muted">載入中…</div>
    </div>

    <!-- 權限開通 -->
    <div class="card">
      <h2>🔑 權限開通</h2>
      <div class="access-tabs">
        <button class="access-tab active" id="tab-by-student" onclick="switchAccessMode('student')">依學員開通</button>
        <button class="access-tab" id="tab-by-series" onclick="switchAccessMode('series')">依系列開通</button>
      </div>

      <!-- 模式一：依學員開通 -->
      <div id="access-mode-student">
        <input type="text" id="access-student-search" placeholder="搜尋學員姓名或 email…" oninput="searchAccessStudents()" style="width:100%">
        <div id="access-student-results" class="access-student-results"></div>
        <div id="access-student-detail"></div>
      </div>

      <!-- 模式二：依系列開通 -->
      <div id="access-mode-series" style="display:none">
        <div class="access-row">
          <select id="access-series-select" onchange="loadSeriesAccessView()"><option value="">選擇系列…</option></select>
        </div>
        <input type="text" id="access-series-student-search" placeholder="搜尋學員姓名或 email…" oninput="renderSeriesAccessList()" style="width:100%;margin-bottom:8px">
        <div id="access-series-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const qs = sel => document.querySelector(sel);
  let mgrKey = sessionStorage.getItem('course_mgr_key') || '';
  let students = [];
  const STUDENT_PAGE_SIZE = 20;
  let studentPage = 1;
  let studentQuery = '';
  let studentTotal = 0;
  let editingStudentId = null;
  let _studentSearchTimer = null;
  let seriesData = { series: [], unclassified: [] };
  let selectedAccessStudent = null;
  let _lastSearchResults = [];
  let seriesAccessMap = {};

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function api(path, opts = {}) {
    const headers = { 'x-manager-key': mgrKey, ...(opts.headers || {}) };
    const r = await fetch(path, { credentials: 'same-origin', ...opts, headers });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || String(r.status)); }
    return r.json();
  }

  async function submitMgrLogin() {
    const pw = qs('#mgr-pw').value;
    if (!pw) return;
    mgrKey = pw;
    try {
      await api('/api/course/admin/students');
      sessionStorage.setItem('course_mgr_key', pw);
      qs('#modal-mgr').style.display = 'none';
      qs('#app').style.display = '';
      loadAll();
    } catch (e) {
      qs('#mgr-err').textContent = '密碼錯誤';
      qs('#mgr-err').style.display = '';
      mgrKey = '';
    }
  }

  function exitMgr() {
    mgrKey = '';
    sessionStorage.removeItem('course_mgr_key');
    qs('#app').style.display = 'none';
    qs('#modal-mgr').style.display = 'flex';
    qs('#mgr-pw').value = '';
  }

  async function tryRestore() {
    if (!mgrKey) return;
    try {
      await api('/api/course/admin/students');
      qs('#modal-mgr').style.display = 'none';
      qs('#app').style.display = '';
      loadAll();
    } catch (e) {
      mgrKey = '';
      sessionStorage.removeItem('course_mgr_key');
    }
  }

  function loadAll() {
    loadApplications();
    loadStudents();
    loadSeriesData();
    searchAccessStudents();
  }

  // ── 名單匯入 ──────────────────────────────────
  function handleFileUpload() {
    const file = qs('#import-file').files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { qs('#import-csv').value = reader.result; };
    reader.readAsText(file);
  }

  async function submitImport() {
    const csv = qs('#import-csv').value.trim();
    const msgEl = qs('#import-msg');
    msgEl.style.display = 'none';
    if (!csv) { msgEl.textContent = '請貼上 CSV 內容或選擇檔案'; msgEl.className = 'msg err'; msgEl.style.display = ''; return; }
    try {
      const r = await api('/api/course/admin/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ csv }) });
      msgEl.textContent = `✓ 匯入完成，新增 ${r.created} 筆，跳過 ${r.skipped} 筆`;
      msgEl.className = 'msg ok';
      msgEl.style.display = '';
      qs('#import-csv').value = '';
      qs('#import-file').value = '';
      loadStudents();
    } catch (e) {
      msgEl.textContent = '匯入失敗：' + e.message;
      msgEl.className = 'msg err';
      msgEl.style.display = '';
    }
  }

  // ── 待審核申請 ──────────────────────────────────
  async function loadApplications() {
    const el = qs('#applications-list');
    try {
      const apps = await api('/api/course/admin/applications?status=pending');
      const badge = qs('#pending-badge');
      if (apps.length) { badge.textContent = apps.length; badge.style.display = ''; }
      else badge.style.display = 'none';

      if (!apps.length) { el.innerHTML = '<div class="muted">目前沒有待審核的申請</div>'; return; }
      el.innerHTML = `<table><thead><tr><th>姓名</th><th>Email</th><th>TV 名稱</th><th>備註</th><th>申請時間</th><th>操作</th></tr></thead><tbody>` +
        apps.map(a => `<tr>
          <td>${esc(a.name)}</td>
          <td>${esc(a.email)}</td>
          <td>${esc(a.tv_name)}</td>
          <td>${esc(a.note || '—')}</td>
          <td>${new Date(a.created_at).toLocaleString('zh-TW')}</td>
          <td class="row-actions">
            <button class="btn btn-success btn-sm" onclick="reviewApp(${a.id},'approve')">核准</button>
            <button class="btn btn-danger btn-sm" onclick="reviewApp(${a.id},'reject')">駁回</button>
          </td>
        </tr>`).join('') + `</tbody></table>`;
    } catch (e) {
      el.innerHTML = `<div class="msg err">載入失敗：${esc(e.message)}</div>`;
    }
  }

  async function reviewApp(id, action) {
    try {
      await api(`/api/course/admin/applications/${id}/${action}`, { method: 'POST' });
      loadApplications();
      loadStudents();
    } catch (e) {
      alert('操作失敗：' + e.message);
    }
  }

  // ── 學員列表 ──────────────────────────────────
  async function loadStudents() {
    const el = qs('#students-list');
    try {
      const params = new URLSearchParams({ page: studentPage, pageSize: STUDENT_PAGE_SIZE });
      if (studentQuery) params.set('q', studentQuery);
      const data = await api('/api/course/admin/students?' + params.toString());
      students = data.students || [];
      studentTotal = data.total || 0;
      qs('#students-title').textContent = `👥 學員列表（共 ${studentTotal} 人）`;

      if (!students.length) {
        el.innerHTML = `<div class="muted">${studentQuery ? '找不到符合的學員' : '尚無學員'}</div>`;
      } else {
        el.innerHTML = `<table><thead><tr><th>姓名</th><th>Email</th><th>TV 名稱</th><th>狀態</th><th>來源</th><th>建立時間</th><th>操作</th></tr></thead><tbody>` +
          students.map(s => {
            const disabled = s.status === 'disabled';
            return `<tr style="${disabled ? 'opacity:.55;background:var(--gray-50)' : ''}">
            <td>${esc(s.name)}${disabled ? ' <span class="status-pill status-disabled">已停用</span>' : ''}</td>
            <td>${esc(s.email)}</td>
            <td>${esc(s.tv_name)}</td>
            <td><span class="status-pill status-${s.status}">${disabled ? '停用' : '啟用'}</span></td>
            <td>${s.source === 'import' ? '名單匯入' : '申請通過'}</td>
            <td>${new Date(s.created_at).toLocaleDateString('zh-TW')}</td>
            <td class="row-actions">
              <button class="btn btn-ghost btn-sm" onclick="toggleStudentStatus(${s.id})">${disabled ? '啟用' : '停用'}</button>
              <button class="btn btn-ghost btn-sm" onclick="openStudentEdit(${s.id})">編輯</button>
              <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id})">刪除</button>
            </td>
          </tr>`;
          }).join('') + `</tbody></table>`;
      }
      renderStudentPager();
    } catch (e) {
      el.innerHTML = `<div class="msg err">載入失敗：${esc(e.message)}</div>`;
    }
  }

  function renderStudentPager() {
    const pager = qs('#students-pager');
    const totalPages = Math.max(1, Math.ceil(studentTotal / STUDENT_PAGE_SIZE));
    if (studentPage > totalPages) studentPage = totalPages;
    pager.style.display = studentTotal > STUDENT_PAGE_SIZE ? 'flex' : 'none';
    qs('#students-pageinfo').textContent = `第 ${studentPage} / ${totalPages} 頁`;
    qs('#students-prev').disabled = studentPage <= 1;
    qs('#students-next').disabled = studentPage >= totalPages;
  }

  function changeStudentPage(delta) {
    studentPage = Math.max(1, studentPage + delta);
    loadStudents();
  }

  function applyStudentSearch(value) {
    clearTimeout(_studentSearchTimer);
    studentQuery = value.trim();
    studentPage = 1;
    loadStudents();
  }

  async function toggleStudentStatus(id) {
    const s = students.find(x => x.id === id);
    if (!s) return;
    const next = s.status === 'disabled' ? 'active' : 'disabled';
    try {
      const updated = await api(`/api/course/admin/students/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: next }),
      });
      s.status = updated.status;
      loadStudents();
    } catch (e) {
      alert('操作失敗：' + e.message);
    }
  }

  function openStudentEdit(id) {
    const s = students.find(x => x.id === id);
    if (!s) return;
    editingStudentId = id;
    qs('#edit-student-name').value = s.name || '';
    qs('#edit-student-email').value = s.email || '';
    qs('#edit-student-tv').value = s.tv_name || '';
    qs('#edit-student-msg').style.display = 'none';
    qs('#modal-student-edit').style.display = 'flex';
  }

  function closeStudentEdit() {
    editingStudentId = null;
    qs('#modal-student-edit').style.display = 'none';
  }

  async function saveStudentEdit() {
    if (!editingStudentId) return;
    const msgEl = qs('#edit-student-msg');
    msgEl.style.display = 'none';
    const body = {
      name: qs('#edit-student-name').value.trim(),
      email: qs('#edit-student-email').value.trim(),
      tv_name: qs('#edit-student-tv').value.trim(),
    };
    try {
      await api(`/api/course/admin/students/${editingStudentId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      closeStudentEdit();
      loadStudents();
    } catch (e) {
      msgEl.textContent = e.message;
      msgEl.style.display = '';
    }
  }

  async function deleteStudent(id) {
    const s = students.find(x => x.id === id);
    if (!confirm(`確定刪除學員「${s ? s.name : id}」？此學員的所有 PDF 開通紀錄也會一併刪除。`)) return;
    try {
      await api(`/api/course/admin/students/${id}`, { method: 'DELETE' });
      loadStudents();
    } catch (e) {
      alert('刪除失敗：' + e.message);
    }
  }

  // ── PDF 管理（依系列分組）──────────────────────
  async function loadSeriesData() {
    try {
      seriesData = await api('/api/course/admin/series');
    } catch (e) {
      seriesData = { series: [], unclassified: [] };
    }
    renderPdfManageList();
    populateSeriesSelect();
    if (selectedAccessStudent) selectAccessStudent(selectedAccessStudent);
  }

  function findPdfById(pdfId) {
    const all = seriesData.series.flatMap(s => s.pdfs).concat(seriesData.unclassified);
    return all.find(p => p.id === pdfId);
  }
  function findPdfEpisodeNo(pdfId) { return findPdfById(pdfId)?.episode_no || 0; }
  function findPdfSeriesId(pdfId) { return findPdfById(pdfId)?.series_id ?? null; }

  function seriesOptionsHtmlFor(selectedId) {
    let html = `<option value="" ${selectedId == null ? 'selected' : ''}>未分類</option>`;
    html += seriesData.series.map(s =>
      `<option value="${s.id}" ${String(s.id) === String(selectedId) ? 'selected' : ''}>${esc(s.name)}</option>`
    ).join('');
    return html;
  }

  function renderPdfManageList() {
    const el = qs('#pdf-manage-list');
    const groups = [...seriesData.series, { id: null, name: '未分類', pdfs: seriesData.unclassified }];
    const html = groups.map(g => {
      if (!g.pdfs.length) return '';
      return `<div class="series-group">
        <div class="series-group-header"><span>${esc(g.name)}（${g.pdfs.length}）</span></div>
        <table><thead><tr><th>標題</th><th>系列</th><th>篇號</th><th>上傳時間</th><th>操作</th></tr></thead><tbody>` +
          g.pdfs.map(p => `<tr>
            <td>${esc(p.title)}</td>
            <td><select onchange="updatePdfSeriesId(${p.id}, this.value)">${seriesOptionsHtmlFor(p.series_id)}</select></td>
            <td><input type="number" value="${p.episode_no || 0}" style="width:56px" min="0" onchange="updatePdfEpisodeNo(${p.id}, this.value)"></td>
            <td>${new Date(p.created_at).toLocaleString('zh-TW')}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deletePdf(${p.id})">刪除</button></td>
          </tr>`).join('') +
        `</tbody></table>
      </div>`;
    }).join('');
    el.innerHTML = html || '<div class="muted">尚未上傳任何 PDF</div>';
  }

  function populateSeriesSelect() {
    const optionsHtml = seriesData.series.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');

    const uploadSel = qs('#pdf-series-select');
    if (uploadSel) uploadSel.innerHTML = '<option value="">未分類</option>' + optionsHtml;

    const accessSel = qs('#access-series-select');
    if (accessSel) {
      const prevVal = accessSel.value;
      accessSel.innerHTML = '<option value="">選擇系列…</option>' + optionsHtml;
      if (prevVal && seriesData.series.some(s => String(s.id) === prevVal)) accessSel.value = prevVal;
    }
  }

  async function createSeries() {
    const name = qs('#new-series-name').value.trim();
    if (!name) return;
    try {
      await api('/api/course/admin/series', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
      qs('#new-series-name').value = '';
      await loadSeriesData();
    } catch (e) {
      alert('新增系列失敗：' + e.message);
    }
  }

  async function uploadPdf() {
    const title = qs('#pdf-title').value.trim();
    const fileInput = qs('#pdf-file');
    const file = fileInput.files[0];
    const seriesId = qs('#pdf-series-select').value;
    const episodeNo = qs('#pdf-episode-no').value;
    const msgEl = qs('#pdf-upload-msg');
    msgEl.style.display = 'none';
    if (!title) { msgEl.textContent = '請輸入標題'; msgEl.className = 'msg err'; msgEl.style.display = ''; return; }
    if (!file) { msgEl.textContent = '請選擇 PDF 檔案'; msgEl.className = 'msg err'; msgEl.style.display = ''; return; }

    const fd = new FormData();
    fd.append('file', file);
    fd.append('title', title);
    if (seriesId) fd.append('series_id', seriesId);
    if (episodeNo) fd.append('episode_no', episodeNo);
    try {
      await api('/api/course/admin/pdfs/upload', { method: 'POST', body: fd });
      msgEl.textContent = '✓ 上傳成功';
      msgEl.className = 'msg ok';
      msgEl.style.display = '';
      qs('#pdf-title').value = '';
      qs('#pdf-episode-no').value = '';
      fileInput.value = '';
      loadSeriesData();
    } catch (e) {
      msgEl.textContent = '上傳失敗：' + e.message;
      msgEl.className = 'msg err';
      msgEl.style.display = '';
    }
  }

  async function deletePdf(id) {
    if (!confirm('確定刪除此 PDF？已開通的學員將立即失去閱讀權限。')) return;
    try {
      await api(`/api/course/admin/pdfs/${id}`, { method: 'DELETE' });
      loadSeriesData();
    } catch (e) {
      alert('刪除失敗：' + e.message);
    }
  }

  async function updatePdfSeriesId(pdfId, newSeriesId) {
    try {
      await api(`/api/course/admin/pdfs/${pdfId}/series`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ series_id: newSeriesId ? Number(newSeriesId) : null, episode_no: findPdfEpisodeNo(pdfId) }),
      });
      await loadSeriesData();
    } catch (e) {
      alert('更新失敗：' + e.message);
      await loadSeriesData();
    }
  }

  async function updatePdfEpisodeNo(pdfId, newEpisodeNo) {
    try {
      await api(`/api/course/admin/pdfs/${pdfId}/series`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ series_id: findPdfSeriesId(pdfId), episode_no: Number(newEpisodeNo) || 0 }),
      });
      await loadSeriesData();
    } catch (e) {
      alert('更新失敗：' + e.message);
      await loadSeriesData();
    }
  }

  // ── 權限開通：模式切換 ──────────────────────────
  function switchAccessMode(mode) {
    qs('#tab-by-student').classList.toggle('active', mode === 'student');
    qs('#tab-by-series').classList.toggle('active', mode === 'series');
    qs('#access-mode-student').style.display = mode === 'student' ? '' : 'none';
    qs('#access-mode-series').style.display = mode === 'series' ? '' : 'none';
  }

  // ── 權限開通：依學員 ────────────────────────────
  async function searchAccessStudents() {
    const q = qs('#access-student-search').value.trim();
    const resultsEl = qs('#access-student-results');
    try {
      const data = await api('/api/course/admin/students?pageSize=1000' + (q ? '&q=' + encodeURIComponent(q) : ''));
      const list = data.students || [];
      _lastSearchResults = list;
      resultsEl.innerHTML = list.length
        ? list.map(s => `<div class="access-student-row" data-id="${s.id}">${esc(s.name)}（${esc(s.email)}）</div>`).join('')
        : '<div class="muted" style="padding:8px 10px">找不到符合的學員</div>';
    } catch (e) {
      resultsEl.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    }
  }

  async function selectAccessStudent(student) {
    selectedAccessStudent = student;
    const detailEl = qs('#access-student-detail');
    detailEl.innerHTML = '<div class="muted">載入中…</div>';
    try {
      const { pdf_ids } = await api(`/api/course/admin/access/by-student/${student.id}`);
      const ownedSet = new Set(pdf_ids);
      detailEl.innerHTML = renderStudentSeriesToggles(student, ownedSet);
    } catch (e) {
      detailEl.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    }
  }

  function renderStudentSeriesToggles(student, ownedSet) {
    const groups = [...seriesData.series, { id: null, name: '未分類', pdfs: seriesData.unclassified }];
    let html = `<div class="access-student-name">${esc(student.name)}（${esc(student.email)}）</div>`;
    let any = false;
    for (const g of groups) {
      if (!g.pdfs.length) continue;
      any = true;
      const allOwned = g.pdfs.every(p => ownedSet.has(p.id));
      html += `<div class="series-group">
        <div class="series-group-header">
          <span>${esc(g.name)}</span>
          ${g.id !== null ? `<label class="switch"><input type="checkbox" ${allOwned ? 'checked' : ''} onchange="onToggleSeries(${student.id}, ${g.id}, this.checked)"><span class="slider"></span></label>` : ''}
        </div>
        <div class="series-group-body">
          ${g.pdfs.map(p => `<div class="pdf-toggle-row">
            <span>${esc(p.title)}</span>
            <label class="switch"><input type="checkbox" ${ownedSet.has(p.id) ? 'checked' : ''} onchange="onTogglePdf(${student.id}, ${p.id}, this.checked)"><span class="slider"></span></label>
          </div>`).join('')}
        </div>
      </div>`;
    }
    return any ? html : html + '<div class="muted">目前尚無任何 PDF</div>';
  }

  async function onTogglePdf(studentId, pdfId, grant) {
    try {
      await api('/api/course/admin/access/toggle', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id: studentId, pdf_id: pdfId, grant }),
      });
    } catch (e) {
      alert('操作失敗：' + e.message);
    }
    if (selectedAccessStudent && selectedAccessStudent.id === studentId) selectAccessStudent(selectedAccessStudent);
  }

  async function onToggleSeries(studentId, seriesId, grant) {
    try {
      await api('/api/course/admin/access/toggle-series', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id: studentId, series_id: seriesId, grant }),
      });
    } catch (e) {
      alert('操作失敗：' + e.message);
    }
    if (selectedAccessStudent && selectedAccessStudent.id === studentId) selectAccessStudent(selectedAccessStudent);
  }

  // ── 權限開通：依系列 ────────────────────────────
  async function loadSeriesAccessView() {
    const seriesId = qs('#access-series-select').value;
    const listEl = qs('#access-series-list');
    if (!seriesId) { listEl.innerHTML = ''; return; }
    listEl.innerHTML = '<div class="muted">載入中…</div>';
    try {
      seriesAccessMap = await api(`/api/course/admin/access/by-series/${seriesId}`);
      await renderSeriesAccessList();
    } catch (e) {
      listEl.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    }
  }

  async function renderSeriesAccessList() {
    const seriesId = qs('#access-series-select').value;
    if (!seriesId) return;
    const q = qs('#access-series-student-search').value.trim();
    const listEl = qs('#access-series-list');
    try {
      const data = await api('/api/course/admin/students?pageSize=1000' + (q ? '&q=' + encodeURIComponent(q) : ''));
      const list = data.students || [];
      const group = seriesData.series.find(s => String(s.id) === String(seriesId));
      const pdfIds = group ? group.pdfs.map(p => p.id) : [];
      listEl.innerHTML = list.length ? list.map(s => {
        const allOwned = pdfIds.length > 0 && pdfIds.every(pid => (seriesAccessMap[pid] || []).includes(s.id));
        return `<div class="pdf-toggle-row">
          <span>${esc(s.name)}（${esc(s.email)}）</span>
          <label class="switch"><input type="checkbox" ${allOwned ? 'checked' : ''} onchange="onToggleSeriesForStudent(${s.id}, ${seriesId}, this.checked)"><span class="slider"></span></label>
        </div>`;
      }).join('') : '<div class="muted">找不到符合的學員</div>';
    } catch (e) {
      listEl.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    }
  }

  async function onToggleSeriesForStudent(studentId, seriesId, grant) {
    try {
      await api('/api/course/admin/access/toggle-series', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id: studentId, series_id: Number(seriesId), grant }),
      });
      seriesAccessMap = await api(`/api/course/admin/access/by-series/${seriesId}`);
    } catch (e) {
      alert('操作失敗：' + e.message);
    }
    await renderSeriesAccessList();
  }

  qs('#mgr-pw').addEventListener('keydown', e => { if (e.key === 'Enter') submitMgrLogin(); });
  qs('#students-search').addEventListener('input', e => {
    clearTimeout(_studentSearchTimer);
    const v = e.target.value;
    _studentSearchTimer = setTimeout(() => applyStudentSearch(v), 300);
  });
  qs('#students-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') applyStudentSearch(e.target.value);
  });
  qs('#access-student-results').addEventListener('click', e => {
    const row = e.target.closest('.access-student-row');
    if (!row) return;
    const id = Number(row.dataset.id);
    const student = _lastSearchResults.find(s => s.id === id);
    if (student) selectAccessStudent(student);
  });
  tryRestore();
</script>
</body>
</html>
