<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發文工作台｜重心開始</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===== TOKENS ===== */
:root{
  --bg:#EDE8DF;
  --surface:#F5F0E8;
  --surface-2:#FDFAF5;
  --surface-0:rgba(58,32,16,.04);
  --brown:#3A2010;
  --brown-mid:#7A4A2A;
  --brick:#B8531A;
  --brick-light:#E8906A;
  --sand:#D4B896;
  --sand-light:#EAD9C4;
  --text:#3A2010;
  --text-mid:rgba(58,32,16,.6);
  --text-muted:rgba(58,32,16,.35);
  --border:rgba(58,32,16,.1);
  --border-strong:rgba(58,32,16,.2);
  --border-accent:#B8531A;
  --bg-accent:rgba(184,83,26,.06);
  --radius:10px;
  --radius-sm:6px;
  --font:'Noto Sans TC',sans-serif;
  --font-display:'Montserrat',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--font);color:var(--text);min-height:100vh}

/* ===== HEADER ===== */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--brick);letter-spacing:.1em;text-transform:uppercase}
.logo-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.pw-input{font-size:12px;padding:5px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:var(--font);width:160px;outline:none}
.pw-input:focus{border-color:var(--brick)}
.conn-status{font-size:11px;display:flex;align-items:center;gap:5px;color:var(--text-muted)}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
.conn-dot.live{background:#4CAF50}

/* ===== LAYOUT ===== */
.layout{min-height:calc(100vh - 56px)}
.left{padding:1.5rem 2rem}

/* ===== WEEK NAV ===== */
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.wnav-btn{background:none;border:1px solid var(--border-strong);color:var(--brown-mid);width:30px;height:30px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.wnav-btn:hover{background:var(--sand-light)}
.week-label{font-size:13px;font-weight:500;color:var(--text);min-width:130px;text-align:center}
.refresh-btn{margin-left:auto;font-size:12px;padding:5px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:none;color:var(--brown-mid);cursor:pointer;font-family:var(--font)}
.refresh-btn:hover{background:var(--sand-light)}

/* ===== CALENDAR GRID ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius);padding:10px;min-height:100px;cursor:pointer;transition:border-color .15s;position:relative}
.day-card:hover{border-color:var(--border-strong)}
.day-card.today{border:1.5px solid var(--border-accent)}
.day-card.empty-day{background:transparent;border-style:dashed;cursor:default;pointer-events:none;opacity:.3}
.day-card.other-month{opacity:.15;pointer-events:none;cursor:default}
.day-card.done{opacity:.4}
.day-card.selected{border-color:var(--border-accent);background:var(--bg-accent)}
.day-card.selected .acc-arrow{transform:rotate(180deg)}
.day-name{font-size:10px;color:var(--text-muted);font-weight:500;margin-bottom:2px}
.day-num{font-size:18px;font-weight:500;color:var(--text);line-height:1;margin-bottom:6px}
.day-num.today-num{color:var(--brick)}
.today-pip{width:5px;height:5px;border-radius:50%;background:var(--brick);display:inline-block;margin-left:4px;vertical-align:middle}
.type-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;margin-bottom:5px}
.b-single{background:#FEF0E0;color:#8A4A08}
.b-carousel{background:#E6F0FE;color:#1A4A8A}
.b-cta{background:#E6F5EE;color:#1A6A3A}
.b-done{background:var(--bg);color:var(--text-muted)}
.day-topic{font-size:11px;color:var(--text-mid);line-height:1.4;padding-right:14px}
.acc-arrow{position:absolute;bottom:6px;right:7px;font-size:11px;color:var(--text-muted);transition:transform .25s;line-height:1}

/* ===== ACCORDION ===== */
.acc-wrap{grid-column:1/-1;overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.acc-wrap.open{max-height:560px}
.acc-inner{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);margin:2px 0 6px;overflow:hidden;display:flex;flex-direction:column}
.acc-hdr{padding:14px 16px 0;flex-shrink:0}
.acc-series{font-size:10px;color:var(--brick);letter-spacing:.1em;text-transform:uppercase;font-weight:500;margin-bottom:4px}
.acc-title-txt{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.35}
.acc-date-meta{font-size:11px;color:var(--text-muted);margin-bottom:10px}
.acc-body{height:340px;overflow-y:auto;padding:0 16px 12px}
.acc-body::-webkit-scrollbar{width:4px}
.acc-body::-webkit-scrollbar-track{background:transparent}
.acc-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
.acc-body .caption-area{background:var(--surface-0);margin-bottom:0}
.acc-footer{padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px}

/* ===== RIGHT PANEL ===== */
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px;gap:8px;text-align:center}
.panel-empty-icon{font-size:32px;opacity:.3}
.panel-header{margin-bottom:1.25rem}
.panel-series{font-size:10px;color:var(--brick);letter-spacing:.1em;text-transform:uppercase;font-weight:500;margin-bottom:6px}
.panel-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:4px}
.panel-meta{font-size:12px;color:var(--text-muted)}
.panel-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.25rem}
.ptab{font-size:13px;padding:7px 16px;cursor:pointer;border:none;background:none;color:var(--text-mid);font-family:var(--font);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.on{color:var(--brick);border-bottom-color:var(--brick);font-weight:500}
.pane{display:none}
.pane.on{display:block}

/* ===== CAPTION PANE ===== */
.caption-area{font-size:13px;color:var(--text);line-height:1.9;white-space:pre-wrap;background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;min-height:120px;margin-bottom:10px}
.caption-loading{font-size:13px;color:var(--text-muted);padding:16px;text-align:center}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:12px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:none;color:var(--text);cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:5px;transition:background .15s}
.btn:hover{background:var(--sand-light)}
.btn-primary{background:var(--brick);border-color:var(--brick);color:#fff;font-weight:500}
.btn-primary:hover{background:#9A3F0E}

/* ===== IMAGE PANE ===== */
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0;min-height:80px}
.img-thumb-card{aspect-ratio:4/5;position:relative;border-radius:6px;overflow:hidden;border:2px solid var(--border);background:var(--surface-0);cursor:default;transition:border-color .15s}
.img-thumb-card.ready{cursor:zoom-in;border-color:var(--border-strong)}
.img-thumb-card.ready:hover{border-color:var(--brick-light)}
.img-thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--text-muted);opacity:.5}
.img-thumb-card img{width:100%;height:100%;object-fit:cover;display:block}
.img-thumb-num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.45);color:#fff;font-size:10px;font-family:var(--font-display);font-weight:700;padding:2px 5px;border-radius:3px;pointer-events:none}
.img-thumb-dl{position:absolute;bottom:4px;right:4px;background:var(--brick);color:#fff;border:none;font-size:11px;padding:3px 7px;border-radius:3px;cursor:pointer;opacity:0;transition:opacity .15s;font-weight:700}
.img-thumb-card.ready:hover .img-thumb-dl{opacity:1}
.img-grid-msg{padding:16px 0;text-align:center;color:var(--text-muted);font-size:12px;grid-column:1/-1}

/* ===== SLIDE GEN (1080×1350, off-screen) ===== */
#slide-gen-wrap{position:fixed;left:-2000px;top:0;width:1080px;height:1350px;overflow:hidden;pointer-events:none}

/* ===== CAPTION MODE TOGGLE ===== */
.caption-mode-toggle{display:flex;gap:6px;margin-bottom:10px}
.cmtab{font-size:12px;padding:5px 13px;border:1px solid var(--border-strong);border-radius:20px;background:none;color:var(--brown-mid);cursor:pointer;font-family:var(--font);font-weight:500;transition:background .15s,color .15s,border-color .15s}
.cmtab.on{background:var(--brick);border-color:var(--brick);color:#fff}
.cmtab:not(.on):hover{background:var(--sand-light)}
.imported-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:#E6F5EE;color:#1A6A3A;font-weight:500;margin-bottom:8px}
.pending-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:#FEF0DC;color:#9A5500;font-weight:500;margin-bottom:5px}
.manual-textarea{width:100%;min-height:150px;font-size:13px;color:var(--text);line-height:1.9;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--font);resize:vertical;outline:none}
.manual-textarea:focus{border-color:var(--brick)}
.pending-notice{font-size:13px;color:#9A5500;background:#FEF6EC;border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:8px;line-height:1.7}

/* ===== ERR / LOADING ===== */
.err-box{font-size:13px;color:#8A2010;background:#FEE8E4;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:1rem}
.loading-msg{font-size:13px;color:var(--text-muted);padding:2rem;text-align:center}

/* ===== VIEW TOGGLE ===== */
.view-toggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;margin-left:8px;flex-shrink:0}
.vtab{font-size:12px;padding:4px 11px;border:none;background:none;color:var(--brown-mid);cursor:pointer;font-family:var(--font);font-weight:500;transition:background .15s,color .15s}
.vtab.on{background:var(--brick);color:#fff}
.vtab:not(.on):hover{background:var(--sand-light)}

/* ===== MONTH HEADERS ===== */
.month-day-hdrs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px}
.month-day-hdr{text-align:center;font-size:11px;color:var(--text-muted);font-weight:500;padding:4px 0}

/* ===== LIGHTBOX ===== */
#carousel-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#carousel-lightbox.on{display:flex}
#lightbox-img{max-width:min(90vw,540px);max-height:90vh;border-radius:var(--radius);box-shadow:0 8px 40px rgba(0,0,0,.5);display:block}
.day-selector{white-space:normal}
.day-selector-item{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:6px;background:var(--surface-2);border:1px solid var(--border)}
.day-selector-item:hover{border-color:var(--brick-light);background:#FEF6F0}
.day-selector-name{font-size:12px;font-weight:500;color:var(--text);margin-top:4px}
.day-selector-meta{font-size:11px;color:var(--text-muted);margin-top:2px}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .cal-grid{grid-template-columns:repeat(4,1fr)}
  .acc-body{height:380px}
  .acc-wrap.open{max-height:800px}
  .left{padding:1rem}
  .header{padding:0 1rem}
  .img-grid{grid-template-columns:repeat(2,1fr)}
}

/* ===== SECTION NAV ===== */
.section-nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;position:sticky;top:57px;z-index:90}
.snav-btn{font-size:13px;font-weight:600;padding:9px 18px;cursor:pointer;border:none;background:none;color:var(--text-mid);font-family:var(--font);border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.snav-btn.on{color:var(--brick);border-bottom-color:var(--brick)}
.snav-btn:not(.on):hover{color:var(--text);background:var(--sand-light)}

/* ===== MATRIX UI ===== */
.mx-wrap{max-width:960px;margin:0 auto;padding:1.5rem 2rem;display:flex;flex-direction:column;gap:1.25rem}
.mx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem}
.mx-card h3{font-size:15px;font-weight:700;color:var(--text);margin:0 0 1rem}
.mx-label{font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:4px;display:block}
.mx-input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bg);font-size:13px;color:var(--text);font-family:var(--font);box-sizing:border-box;outline:none;transition:border-color .15s}
.mx-input:focus{border-color:var(--brick)}
.mx-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.mx-dist-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mx-dist-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-mid)}
.mx-dist-item input{width:60px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bg);font-size:13px;color:var(--text);font-family:var(--font);text-align:center;outline:none}
.mx-dist-msg{font-size:12px;margin-top:6px}
.prog-wrap{background:var(--border);border-radius:99px;height:8px;margin:6px 0;overflow:hidden}
.prog-fill{height:100%;background:var(--brick);border-radius:99px;transition:width .4s ease}
.prog-text{font-size:12px;color:var(--text-mid);text-align:center;margin-top:4px}
.type-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;display:inline-block}
.tb-pure{background:var(--surface-0);color:var(--text-mid);border:1px solid var(--border)}
.tb-soft{background:rgba(212,184,150,.3);color:var(--brown-mid);border:1px solid var(--sand)}
.tb-explicit{background:var(--bg-accent);color:var(--brick);border:1px solid rgba(184,83,26,.2)}
.matrix-table{width:100%;border-collapse:collapse;font-size:13px}
.matrix-table th{background:var(--surface-0);font-size:11px;font-weight:700;color:var(--text-mid);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.matrix-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.matrix-preview{white-space:pre-line;line-height:1.7;max-height:4.5em;overflow:hidden;color:var(--text);cursor:pointer}
.matrix-preview.expanded{max-height:none}
.mx-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.bio-table{width:100%;border-collapse:collapse;font-size:13px}
.bio-table th{background:var(--surface-0);font-size:11px;font-weight:700;color:var(--text-mid);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.bio-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
</style>
</head>
<body>

<header class="header">
  <div>
    <div class="logo">重心開始</div>
    <div class="logo-sub">發文工作台</div>
  </div>
  <div class="header-right">
    <a href="/field-visits.html" style="font-size:.82rem;color:inherit;opacity:.8;text-decoration:none;white-space:nowrap">📍 外出記錄</a>
    <input type="password" class="pw-input" id="pw-input" placeholder="TEAM_PASSWORD" autocomplete="off">
    <button class="refresh-btn" onclick="loadData()">載入 ↻</button>
    <div class="conn-status">
      <div class="conn-dot" id="conn-dot"></div>
      <span id="conn-label">未連線</span>
    </div>
  </div>
</header>

<!-- Section navigation tabs -->
<nav class="section-nav">
  <button class="snav-btn on" id="stab-calendar" onclick="switchSection('calendar')">📅 內容日曆</button>
  <button class="snav-btn" id="stab-matrix" onclick="switchSection('matrix')">⚡ 批量矩陣</button>
</nav>

<!-- Calendar section -->
<div id="section-calendar">
<div class="layout">
  <div class="left">
    <div class="week-nav">
      <button class="wnav-btn" onclick="changeNav(-1)">&#8592;</button>
      <div class="week-label" id="week-label">—</div>
      <button class="wnav-btn" onclick="changeNav(1)">&#8594;</button>
      <div class="view-toggle">
        <button class="vtab on" id="vtab-week" onclick="setView('week')">週</button>
        <button class="vtab" id="vtab-month" onclick="setView('month')">月</button>
      </div>
      <button class="refresh-btn" onclick="loadData()">重新整理</button>
    </div>
    <div id="cal-wrap">
      <div class="loading-msg">輸入密碼後按「載入」</div>
    </div>
  </div>
</div>
</div>

<!-- Matrix section -->
<div id="section-matrix" style="display:none">
  <div class="mx-wrap">

    <!-- Input card -->
    <div class="mx-card">
      <h3>⚡ 批量文案設定</h3>
      <div class="mx-row" style="margin-bottom:12px">
        <div style="flex:1;min-width:200px">
          <label class="mx-label">主題</label>
          <input id="mx-topic" type="text" class="mx-input" placeholder="例：情緒不穩別摸盤">
        </div>
        <div style="width:120px">
          <label class="mx-label">變體數量</label>
          <select id="mx-count" class="mx-input" onchange="updateDistributionFromCount()">
            <option value="10">10 篇</option>
            <option value="50">50 篇</option>
            <option value="100" selected>100 篇</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label class="mx-label">補充說明（選填）</label>
        <textarea id="mx-notes" class="mx-input" style="min-height:60px;resize:vertical" placeholder="切角偏好、語感要求等"></textarea>
      </div>
      <div style="margin-bottom:8px">
        <label class="mx-label">導流分配（三項合計需等於總數量）</label>
        <div class="mx-dist-box">
          <div class="mx-dist-item">
            <input id="mx-pure" type="number" value="40" min="0" oninput="validateDistribution()">
            <span>純內容</span>
          </div>
          <div class="mx-dist-item">
            <input id="mx-soft" type="number" value="40" min="0" oninput="validateDistribution()">
            <span>軟導流</span>
          </div>
          <div class="mx-dist-item">
            <input id="mx-explicit" type="number" value="20" min="0" oninput="validateDistribution()">
            <span>明確導流</span>
          </div>
        </div>
        <div id="mx-dist-msg" class="mx-dist-msg" style="color:var(--text-mid)">✓ 合計 100 篇</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <button id="mx-gen-btn" class="btn btn-primary" onclick="generateMatrix()">✦ 批量產出</button>
        <span style="font-size:11px;color:var(--text-muted)">共 11 次 GPT 呼叫，約需 2–4 分鐘</span>
      </div>
    </div>

    <!-- Matrix progress -->
    <div id="matrix-progress" style="display:none">
      <div class="mx-card" style="padding:1rem 1.5rem">
        <div class="prog-wrap"><div id="matrix-prog-bar" class="prog-fill" style="width:0%"></div></div>
        <div id="matrix-prog-text" class="prog-text">準備中…</div>
      </div>
    </div>

    <!-- Matrix results -->
    <div id="matrix-results" style="display:none">
      <div class="mx-card" style="padding:1rem 1.5rem">
        <div class="mx-toolbar">
          <button class="btn btn-primary" onclick="exportMatrixExcel()">↓ 匯出 Excel</button>
        </div>
        <div style="overflow-x:auto">
          <table class="matrix-table">
            <thead>
              <tr>
                <th>#</th>
                <th>導流類型</th>
                <th>文案（點擊展開/編輯）</th>
                <th>字數</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="matrix-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Bio section -->
    <div class="mx-card">

// ===== STATE =====
let pw = '';
let viewMode = 'week';
let curDate = new Date();
let curMonthDate = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let eventsCache = [];
let monthEventsCache = [];
let selEvent = null;
let selDate = null;
let generatedCaption = '';
let carouselCanvases = [];
let captionMode = 'gpt'; // 'gpt' | 'manual'
let manualCaption = '';
let manualLocked = false;

// ===== UTILS =====
function weekStart(d) {
  const day = new Date(d);
  const diff = day.getDay() === 0 ? -6 : 1 - day.getDay();
  day.setDate(day.getDate() + diff);
  return day;
}
function fmtISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDisplay(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
const DAY_NAMES = ['週日','週一','週二','週三','週四','週五','週六'];
const TYPE_LABEL = {single:'單篇',carousel:'輪播',cta:'CTA'};
const TYPE_BADGE = {single:'b-single',carousel:'b-carousel',cta:'b-cta'};

function setConn(live, msg) {
  document.getElementById('conn-dot').className = 'conn-dot' + (live ? ' live' : '');
  document.getElementById('conn-label').textContent = msg;
}

// ===== VIEW CONTROL =====
function setView(mode) {
  if (mode === 'month') {
    curMonthDate = new Date(curDate.getFullYear(), curDate.getMonth(), 1);
  } else {
    curDate = new Date(curMonthDate.getFullYear(), curMonthDate.getMonth(), 1);
  }
  viewMode = mode;
  document.getElementById('vtab-week').classList.toggle('on', mode === 'week');
  document.getElementById('vtab-month').classList.toggle('on', mode === 'month');
  loadData();
}

function loadData() {
  if (viewMode === 'month') loadMonth();
  else loadWeek();
}

function changeNav(dir) {
  if (viewMode === 'month') {
    curMonthDate = new Date(curMonthDate.getFullYear(), curMonthDate.getMonth() + dir, 1);
  } else {
    curDate = new Date(curDate.getTime() + dir * 7 * 86400000);
  }
  loadData();
}

// ===== LOAD WEEK =====
async function loadWeek() {
  pw = document.getElementById('pw-input').value.trim();
  if (!pw) { setConn(false, '請輸入密碼'); return; }
  setConn(false, '連線中…');
  document.getElementById('cal-wrap').innerHTML = '<div class="loading-msg">載入中…</div>';
  closeAllAccordions();
  const ws = weekStart(curDate);
  const iso = fmtISO(ws);
  document.getElementById('week-label').textContent =
    `${fmtDisplay(ws)} – ${fmtDisplay(new Date(ws.getTime()+6*86400000))}`;
  try {
    const res = await fetch(`${API_BASE}/api/content-calendar/events?week=${iso}`, {
      headers: { Authorization: 'Basic ' + btoa(':' + pw) }
    });
    if (res.status === 401) { setConn(false,'密碼錯誤'); document.getElementById('cal-wrap').innerHTML='<div class="err-box">密碼錯誤</div>'; return; }
    if (!res.ok) throw new Error(res.status);
    eventsCache = await res.json();
    if (!Array.isArray(eventsCache)) eventsCache = eventsCache.events || [];
    setConn(true, '已連線');
    renderCalendar(ws);
  } catch(e) {
    setConn(false,'連線失敗');
    document.getElementById('cal-wrap').innerHTML = `<div class="err-box">無法連線：${e.message}</div>`;
  }
}

// ===== LOAD MONTH =====
async function loadMonth() {
  pw = document.getElementById('pw-input').value.trim();
  if (!pw) { setConn(false, '請輸入密碼'); return; }
  setConn(false, '連線中…');
  document.getElementById('cal-wrap').innerHTML = '<div class="loading-msg">載入中…</div>';
  closeAllAccordions();
  const y = curMonthDate.getFullYear();
  const mo = String(curMonthDate.getMonth() + 1).padStart(2, '0');
  const monthStr = `${y}-${mo}`;
  document.getElementById('week-label').textContent = `${y} 年 ${curMonthDate.getMonth() + 1} 月`;
  try {
    const res = await fetch(`${API_BASE}/api/content-calendar/events?month=${monthStr}`, {
      headers: { Authorization: 'Basic ' + btoa(':' + pw) }
    });
    if (res.status === 401) { setConn(false,'密碼錯誤'); document.getElementById('cal-wrap').innerHTML='<div class="err-box">密碼錯誤</div>'; return; }
    if (!res.ok) throw new Error(res.status);
    monthEventsCache = await res.json();
    if (!Array.isArray(monthEventsCache)) monthEventsCache = monthEventsCache.events || [];
    setConn(true, '已連線');
    renderMonthCalendar();
  } catch(e) {
    setConn(false,'連線失敗');
    document.getElementById('cal-wrap').innerHTML = `<div class="err-box">無法連線：${e.message}</div>`;
  }
}

// ===== RENDER MONTH CALENDAR =====
function renderMonthCalendar() {
  const y = curMonthDate.getFullYear();
  const mo = curMonthDate.getMonth();
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(y, mo, 1);
  const startDow = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
  const lastDate = new Date(y, mo + 1, 0).getDate();
  const totalCells = Math.ceil((startDow + lastDate) / 7) * 7;

  const hdrs = ['一','二','三','四','五','六','日'];
  let html = '<div class="month-day-hdrs">';
  hdrs.forEach(h => { html += `<div class="month-day-hdr">${h}</div>`; });
  html += '</div><div class="cal-grid">';

  for (let i = 0; i < totalCells; i++) {
    const dayN = i - startDow + 1;
    const date = new Date(y, mo, dayN);
    const isCurMonth = date.getMonth() === mo;
    const iso = fmtISO(date);
    const isToday = date.getTime() === today.getTime();
    const isPast = date < today;
    const rowIdx = Math.floor(i / 7);

    if (!isCurMonth) {
      html += `<div class="day-card other-month"><div class="day-num">${date.getDate()}</div></div>`;
    } else {
      const dayEvs = monthEventsCache.filter(e => e.date === iso);
      const hasEvs = dayEvs.length > 0;
      const isDone = isPast && !isToday;
      const cls = ['day-card', isToday ? 'today' : '', isDone && hasEvs ? 'done' : '', !hasEvs ? 'empty-day' : ''].filter(Boolean).join(' ');

      const evHtml = dayEvs.slice(0, 2).map(ev => `
        <span class="type-badge ${isDone ? 'b-done' : TYPE_BADGE[ev.type]||'b-single'}">${isDone ? '已發' : TYPE_LABEL[ev.type]||ev.type}</span>
        ${ev.pending && !isDone ? '<span class="pending-badge">待填入</span>' : ''}
        <div class="day-topic">${ev.topic}</div>`).join('');

      const moreHtml = dayEvs.length > 2 ? `<div style="font-size:10px;color:var(--text-muted)">+${dayEvs.length-2} 筆</div>` : '';
      const onclick = hasEvs ? `onclick="selectDay('${iso}',${rowIdx})"` : '';

      html += `<div class="${cls}" id="dc-${iso}" ${onclick}>
        <div class="day-num${isToday?' today-num':''}">${date.getDate()}${isToday?'<span class="today-pip"></span>':''}</div>
        ${evHtml}${moreHtml}
        ${hasEvs ? '<div class="acc-arrow">▾</div>' : ''}
      </div>`;
    }

    if ((i + 1) % 7 === 0) {
      html += `<div class="acc-wrap" data-row="${Math.floor(i / 7)}"></div>`;
    }
  }

  html += '</div>';
  document.getElementById('cal-wrap').innerHTML = html;
}

// ===== RENDER CALENDAR =====
function renderCalendar(ws) {
  const today = new Date(); today.setHours(0,0,0,0);
  let html = '<div class="cal-grid">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws.getTime() + i * 86400000);
    const iso = fmtISO(d);
    const isToday = d.getTime() === today.getTime();
    const isPast = d < today;
    const ev = eventsCache.find(e => e.date === iso);
    const dayName = DAY_NAMES[d.getDay()];
    if (!ev) {
      html += `<div class="day-card empty-day"><div class="day-name">${dayName}</div><div class="day-num">${d.getDate()}</div></div>`;
    } else {
      const isDone = isPast && !isToday;
      html += `<div class="day-card${isToday?' today':''}${isDone?' done':''}" id="dc-${iso}" onclick="selectDay('${iso}',0)">
        <div class="day-name">${dayName}</div>
        <div class="day-num${isToday?' today-num':''}">${d.getDate()}${isToday?'<span class="today-pip"></span>':''}</div>
        <span class="type-badge ${isDone?'b-done':TYPE_BADGE[ev.type]||'b-single'}">${isDone?'已發':TYPE_LABEL[ev.type]||ev.type}</span>
        ${ev.pending && !isDone ? '<span class="pending-badge">待填入</span>' : ''}
        <div class="day-topic">${ev.topic}</div>
        <div class="acc-arrow">▾</div>
      </div>`;
    }
  }
  html += '<div class="acc-wrap" data-row="0"></div>';
  html += '</div>';
  document.getElementById('cal-wrap').innerHTML = html;
}

// ===== SELECT DAY (unified: week + month) =====
function selectDay(iso, rowIdx) {
  const events = viewMode === 'month'
    ? monthEventsCache.filter(e => e.date === iso)
    : eventsCache.filter(e => e.date === iso);
  if (!events.length) return;

  if (selDate === iso) { closeAllAccordions(); return; }

  closeAllAccordions();
  selDate = iso;
  const dc = document.getElementById('dc-' + iso);
  if (dc) dc.classList.add('selected');

  const wrap = document.querySelector(`.acc-wrap[data-row="${rowIdx}"]`);
  if (!wrap) return;

  if (events.length === 1) {
    selEvent = events[0];
    generatedCaption = '';
    captionMode = events[0].pending ? 'manual' : 'gpt';
    manualCaption = '';
    manualLocked = false;
    wrap.innerHTML = buildAccordionHTML(iso, events[0]);
  } else {
    selEvent = null;
    wrap.innerHTML = buildAccordionSelectorHTML(iso, events);
  }
  wrap.classList.add('open');
}

function buildAccordionHTML(iso, ev) {
  const badge = TYPE_BADGE[ev.type] || 'b-single';
  const label = TYPE_LABEL[ev.type] || ev.type;
  const initManual = captionMode === 'manual';
  const footerCaptionHTML = initManual
    ? '<button class="btn btn-primary" onclick="saveManualCaption()">儲存</button>'
    : '<button class="btn btn-primary" id="gen-caption-btn" onclick="genCaption()">✦ 產出文案</button><button class="btn" onclick="copyCaption()">複製（乾淨版）</button>';
  return `<div class="acc-inner">
    <div class="acc-hdr">
      ${ev.series ? `<div class="acc-series">${ev.series}</div>` : ''}
      <div class="acc-title-txt">${ev.topic}</div>
      <div class="acc-date-meta">${iso} ${ev.time||'09:00'} ｜ <span class="type-badge ${badge}" style="display:inline;padding:1px 6px">${label}</span></div>
    </div>
    <div class="panel-tabs">
      <button class="ptab on" onclick="switchPane('caption',this)">文案</button>
      <button class="ptab" onclick="switchPane('image',this)">出圖</button>
    </div>
    <div class="acc-body">
      <div class="pane on" id="pane-caption">
        <div class="caption-mode-toggle">
          <button class="cmtab ${initManual?'':'on'}" id="cmtab-gpt" onclick="setCaptionMode('gpt')">✦ GPT 產出</button>
          <button class="cmtab ${initManual?'on':''}" id="cmtab-manual" onclick="setCaptionMode('manual')">📋 手動匯入</button>
        </div>
        <div id="caption-gpt-area" style="${initManual?'display:none':''}">
          <div class="caption-area" id="caption-area">點「產出文案」按鈕</div>
        </div>
        <div id="caption-manual-area" style="${initManual?'':'display:none'}">
          ${ev.pending ? '<div class="pending-notice">⏳ 這篇需要當天數據，請在數據公布後填入文案</div>' : ''}
          <textarea class="manual-textarea" id="manual-textarea" placeholder="貼入文案…"></textarea>
        </div>
      </div>
      <div class="pane" id="pane-image">
        <div class="img-grid" id="img-grid">
          <div class="img-grid-msg">先產出文案，再點「生成圖片」</div>
        </div>
      </div>
    </div>
    <div class="acc-footer">
      <div id="footer-caption" class="btn-row">${footerCaptionHTML}</div>
      <div id="footer-image" class="btn-row" style="display:none">
        <button class="btn btn-primary" id="gen-image-btn" onclick="genImages()">✦ 生成圖片</button>
        <button class="btn" id="dl-zip-btn" style="display:none" onclick="downloadZip()">↓ 下載全部 ZIP</button>
      </div>
    </div>
  </div>`;
}

function buildAccordionSelectorHTML(iso, evs) {
  const items = evs.map((ev, i) => `
    <div class="day-selector-item" onclick="pickAccordionEvent('${iso}',${i})">
      <span class="type-badge ${TYPE_BADGE[ev.type]||'b-single'}">${TYPE_LABEL[ev.type]||ev.type}</span>
      <div class="day-selector-name">${ev.topic}</div>
      <div class="day-selector-meta">${ev.time||'09:00'}${ev.series?' ｜ '+ev.series:''}</div>
    </div>`).join('');
  return `<div class="acc-inner">
    <div class="acc-hdr">
      <div class="acc-title-txt">${iso} 有 ${evs.length} 篇貼文</div>
      <div class="acc-date-meta">選擇要操作的貼文</div>
    </div>
    <div class="acc-body"><div class="day-selector">${items}</div></div>
  </div>`;
}

function pickAccordionEvent(iso, idx) {
  const events = viewMode === 'month'
    ? monthEventsCache.filter(e => e.date === iso)
    : eventsCache.filter(e => e.date === iso);
  if (!events[idx]) return;
  selEvent = events[idx];
  generatedCaption = '';
  captionMode = events[idx].pending ? 'manual' : 'gpt';
  manualCaption = '';
  manualLocked = false;
  const wrap = document.querySelector('.acc-wrap.open');
  if (wrap) wrap.innerHTML = buildAccordionHTML(iso, selEvent);
}

// ===== CLOSE ALL ACCORDIONS =====
function closeAllAccordions() {
  document.querySelectorAll('.acc-wrap').forEach(w => { w.classList.remove('open'); w.innerHTML = ''; });
  document.querySelectorAll('.day-card').forEach(c => c.classList.remove('selected'));
  selDate = null;
  selEvent = null;
}

function switchPane(name, btn) {
  document.querySelectorAll('.ptab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));

function cleanCaption(text) {
  const lines = text.split('\n').map(line => {
    // 移除張次標記：第1張、第 1 張｜封面 等整行
    if (/^[^\S\n]*第\s*\d+\s*張/.test(line)) return '';
    // 移除免責聲明整行（＊ 或 * 開頭）
    if (/^[^\S\n]*[＊*]/.test(line)) return '';
    // 移除欄位標記，保留後方內容
    return line.replace(/^[^\S\n]*(標題|正文|Hook|本文|行動指令|視覺建議)[：:]\s*/, '');
  });
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function copyCaption() {
  const raw = captionMode === 'manual' ? manualCaption
    : (document.getElementById('caption-area') || {}).textContent || '';
  const text = cleanCaption(raw);
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('#footer-caption .btn:not(.btn-primary)');
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '已複製！';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

// ===== PARSE SLIDES (keyword matching, no 第N張 dependency) =====
function parseSlides(text) {
  // Find all 標題： markers and their positions
  const titles = [...text.matchAll(/(?:^|\n)[^\S\n]*標題[：:]\s*(.+)/g)];
  if (!titles.length) return null;
  const slides = [];
  for (let i = 0; i < Math.min(titles.length, 10); i++) {
    const title = titles[i][1].trim();
    const blockStart = titles[i].index + titles[i][0].length;
    const blockEnd   = i + 1 < titles.length ? titles[i + 1].index : text.length;
    const block      = text.slice(blockStart, blockEnd);
    // Extract body after 正文：
    const bodyMatch  = block.match(/[^\S\n]*正文[：:]\s*([\s\S]+)/);
    let body = bodyMatch ? bodyMatch[1] : '';
    // Remove disclaimer lines and structural labels
    body = body.split('\n').filter(l => {
      const t = l.trim();
      return t && !/^[＊*]/.test(t) && !/^視覺建議[：:]/.test(t) && !/^第\s*\d+\s*張/.test(t);
    }).join('\n').trim();
    if (title) slides.push({ index: slides.length + 1, title, body });
  }
  return slides.length > 0 ? slides : null;
}

// ===== AUTO SHRINK BODY FONT SIZE =====
function fitBodyFontSize(bodyEl) {
  if (!bodyEl) return;
  // maxH: for flex:1 elements use clientHeight; for max-height elements use parseInt
  const styleMaxH = parseInt(bodyEl.style.maxHeight);
  const maxH = (styleMaxH > 0) ? styleMaxH : bodyEl.clientHeight;
  if (!maxH) return;
  const sizes = [28, 24, 20, 18];
  for (const sz of sizes) {
    bodyEl.style.fontSize = sz + 'px';
    bodyEl.style.lineHeight = '1.7';
    if (bodyEl.scrollHeight <= maxH) return; // fits
  }
  // At 18px overflow:hidden clips the rest
}

    }
  } else {
    // single / cta: treat whole caption as the body of one slide
    const body = (generatedCaption || '')
      .split('\n').filter(l => !/^[＊*]/.test(l.trim())).join('\n').trim();
    slides = [{ index: 1, title: selEvent.topic, body }];
  }

  const total = slides.length;
  carouselCanvases = new Array(total).fill(null);

  grid.innerHTML = '';
  slides.forEach((_, i) => {
    const card = document.createElement('div');
    card.className = 'img-thumb-card';
    card.id = `thumb-${i}`;
    card.innerHTML = `<div class="img-thumb-placeholder">${i + 1}</div>`;

  });

  if (genBtn) { genBtn.textContent = `生成中 0/${total}…`; genBtn.disabled = true; }
  if (zipBtn) zipBtn.style.display = 'none';

  await document.fonts.ready;
  const genWrap = document.getElementById('slide-gen-wrap');

  for (let i = 0; i < total; i++) {
    if (genBtn) genBtn.textContent = `生成中 ${i + 1}/${total}…`;
    const layout = i === 0 ? 'cover' : i === total - 1 && total > 1 ? 'outro' : 'content';
    genWrap.innerHTML = buildSlideDiv(slides[i], total, layout);
    await new Promise(r => setTimeout(r, 80)); // flush layout
    const bodyEl = genWrap.querySelector('.slide-body');
    fitBodyFontSize(bodyEl);
    await new Promise(r => setTimeout(r, 60)); // let font size settle

    const card = document.getElementById(`thumb-${i}`);
    try {
      const canvas = await html2canvas(genWrap.firstElementChild, {
        scale: 1, useCORS: true, backgroundColor: '#F5EFE5', logging: false,
        width: 1080, height: 1350,
      });
      carouselCanvases[i] = canvas;
      if (card) {
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/jpeg', 0.88);
        const numDiv = document.createElement('div');
        numDiv.className = 'img-thumb-num';
        numDiv.textContent = `${i + 1}/${total}`;
        const dlBtn2 = document.createElement('button');
        dlBtn2.className = 'img-thumb-dl';
        dlBtn2.textContent = '↓';
        const idx = i;
        dlBtn2.onclick = e => { e.stopPropagation(); downloadSingle(idx); };
        card.innerHTML = '';
        card.className = 'img-thumb-card ready';
        card.onclick = () => openLightbox(i);
        card.appendChild(img);
        card.appendChild(numDiv);
        card.appendChild(dlBtn2);
      }
    } catch (e) {
      carouselCanvases[i] = null;
      if (card) card.innerHTML = '<div class="img-thumb-placeholder" style="font-size:11px;color:#8A2010;white-space:nowrap">生成失敗</div>';
    }
  }

  genWrap.innerHTML = '';
  if (genBtn) { genBtn.textContent = '✦ 生成圖片'; genBtn.disabled = false; }
  if (zipBtn && carouselCanvases.some(Boolean)) zipBtn.style.display = '';
}

let matrixVariants = [];

const LINK_RE = /https?:\/\/[^\s<>"]+|www\.[^\s<>"]+|bit\.ly\/[^\s<>"]+|lin\.ee\/[^\s<>"]+|t\.me\/[^\s<>"]+|linktr\.ee\/[^\s<>"]+/gi;
const BIO_BANNED = ['保證獲利','穩賺','必賺','零風險','保本','賣課','保證'];

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function stripLinks(text) {
  return text.replace(LINK_RE, '').replace(/[ \t]{2,}/g, ' ').trim();
}

function hasBannedWord(text) {
  return BIO_BANNED.some(w => text.includes(w));
}

function cleanBannedWords(text) {
  let r = text;
  BIO_BANNED.forEach(w => { while (r.includes(w)) r = r.split(w).join(''); });
  return r.replace(/\s{2,}/g, ' ').trim();
}

function parseDelimited(text) {
  const parts = text.split(/===\s*\d+\s*===/);
  const results = [];
  for (let i = 1; i < parts.length; i++) {
    const chunk = parts[i].trim();
    if (chunk) results.push(chunk);
  }
  return results.length ? results : (text.trim() ? [text.trim()] : []);
}

function validateDistribution() {

  const soft = parseInt(document.getElementById('mx-soft').value) || 0;
  const expl = parseInt(document.getElementById('mx-explicit').value) || 0;
  const total = pure + soft + expl;
  const msg = document.getElementById('mx-dist-msg');

    msg.textContent = '⚠ 合計 ' + total + ' 篇，與 ' + count + ' 篇不符';
    msg.style.color = '#8A2010';
    return false;
  }
  msg.textContent = '✓ 合計 ' + total + ' 篇';
  msg.style.color = '#1A6A3A';
  return true;
}

function updateDistributionFromCount() {
  const count = parseInt(document.getElementById('mx-count').value) || 100;
  const pure = Math.round(count * 0.4);
  const expl = Math.round(count * 0.2);
  const soft = count - pure - expl;
  document.getElementById('mx-pure').value = pure;
  document.getElementById('mx-soft').value = soft;
  document.getElementById('mx-explicit').value = expl;
  validateDistribution();
}

    const skelPrompt = '主題：' + topic + '\n補充說明：' + (matrixNotes || '無') + '\n\n' +
      '請依照你的文案風格 SOP，為此主題產出 10 個不同切角的 Threads 純文字貼文骨架。\n\n' +
      '每個骨架：\n- 切角不重複（痛點體驗、反轉觀點、時間序事件、結果分享、對比情境等輪替）\n' +
      '- 60–120 字，不分張，口語化\n' +
      '- 嚴禁出現任何連結（http://、https://、群組連結等）\n' +
      '- 結尾不加任何導流語句\n\n' +
      '輸出格式（嚴格按照，不要有其他說明文字）：\n' + skelFmt;

    const skelText = await callGPT(skelPrompt, SOP_SYSTEM, 3500);
    let skeletons = parseDelimited(skelText);
    while (skeletons.length < 10) skeletons.push(skeletons[0] || topic);
    skeletons = skeletons.slice(0, 10).map(stripLinks);
    progBar.style.width = '8%';

    // Step 2: variants for each skeleton
    const allTexts = [];
    for (let s = 0; s < 10; s++) {
      progText.textContent = '產出中 ' + allTexts.length + '/' + matrixCount + '（骨架 ' + (s + 1) + '/10）';
      progBar.style.width = (8 + s * 9) + '%';

      let varFmt = '';
      for (let k = 1; k <= varPer; k++) varFmt += '===' + k + '===\n（變體' + k + '）\n';
      const varPrompt = '以下是一個 Threads 貼文骨架：\n\n' + skeletons[s] + '\n\n' +
        '請基於此骨架，產出 ' + varPer + ' 篇具有「實質差異」的變體文案。\n\n' +
        '差異要求（每篇至少改變 2 種以上）：\n' +
        '- 換開頭句式或情境\n- 調換段落或句子順序\n- 換不同具體數字舉例\n- 換部分用詞（同義但感受不同）\n\n' +
        '嚴禁出現任何連結（http://、https://、群組連結等）。\n結尾不加任何導流語句（導流結尾由系統自動套用）。\n\n' +
        '輸出格式（嚴格按照，不要有其他說明）：\n' + varFmt;

      const varText = await callGPT(varPrompt, SOP_SYSTEM, 3500);
      let variants = parseDelimited(varText);
      while (variants.length < varPer) variants.push(skeletons[s]);
      variants = variants.slice(0, varPer).map(stripLinks);
      allTexts.push(...variants);
    }

    progBar.style.width = '95%';
    progText.textContent = '整理中…';

    // Assign traffic types in order
    const TYPE_SUFFIX = { pure: '', soft: '\n\n（更完整的我放在主頁）', explicit: '\n\n追蹤 @yusheng.zhu.14' };
    const TYPE_LABEL  = { pure: '純內容', soft: '軟導流', explicit: '明確導流' };
    const TYPE_CLS    = { pure: 'tb-pure', soft: 'tb-soft', explicit: 'tb-explicit' };
    const order = [];
    for (let i = 0; i < pureCount; i++) order.push('pure');
    for (let i = 0; i < softCount; i++) order.push('soft');
    for (let i = 0; i < explCount; i++) order.push('explicit');

    matrixVariants = allTexts.slice(0, matrixCount).map((text, i) => {
      const t = order[i] || 'pure';
      const content = text + TYPE_SUFFIX[t];
      return { id: i + 1, type: t, typeLabel: TYPE_LABEL[t], typeCls: TYPE_CLS[t], content, charCount: content.length };
    });

    progBar.style.width = '100%';
    progText.textContent = '✓ 完成！共 ' + matrixCount + ' 篇';
    renderMatrixTable();
    resultsEl.style.display = '';
    resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    progText.textContent = '❌ 產出失敗：' + e.message;
    console.error('[matrix]', e);
  } finally {
    genBtn.disabled = false;
    genBtn.textContent = '✦ 批量產出';
  }
}

function renderMatrixTable() {
  const tbody = document.getElementById('matrix-tbody');
  if (!tbody) return;
  tbody.innerHTML = matrixVariants.map(v =>
    '<tr id="mrow-' + v.id + '">' +
      '<td style="width:36px;text-align:center;font-size:11px;color:var(--text-muted);white-space:nowrap">' + String(v.id).padStart(3, '0') + '</td>' +
      '<td style="width:70px"><span class="type-badge ' + v.typeCls + '">' + v.typeLabel + '</span></td>' +
      '<td onclick="toggleMEdit(' + v.id + ')">' +
        '<div id="mprev-' + v.id + '" class="matrix-preview">' + escHtml(v.content) + '</div>' +
        '<div id="medit-' + v.id + '" style="display:none;padding-top:6px" onclick="event.stopPropagation()">' +
          '<textarea id="meta-' + v.id + '" style="width:100%;min-height:100px;font-size:13px;line-height:1.7;padding:7px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bg);font-family:var(--font);resize:vertical;box-sizing:border-box;outline:none" oninput="mCharCount(' + v.id + ')">' + escHtml(v.content) + '</textarea>' +
          '<div style="display:flex;gap:6px;margin-top:4px">' +
            '<button class="btn btn-primary" style="font-size:11px;padding:3px 10px" onclick="saveMEdit(' + v.id + ')">儲存</button>' +
            '<button class="btn" style="font-size:11px;padding:3px 10px" onclick="cancelMEdit(' + v.id + ')">取消</button>' +
          '</div>' +
        '</div>' +
      '</td>' +
      '<td id="mcc-' + v.id + '" style="width:36px;text-align:center;font-size:11px;color:var(--text-muted)">' + v.charCount + '</td>' +
      '<td style="width:50px;text-align:center"><button class="btn" style="font-size:11px;padding:3px 7px;white-space:nowrap" onclick="event.stopPropagation();regenVariant(' + v.id + ')">重產</button></td>' +
    '</tr>'
  ).join('');
}

function toggleMEdit(id) {
  const prev = document.getElementById('mprev-' + id);
  const edit = document.getElementById('medit-' + id);
  if (!prev || !edit) return;
  const opening = edit.style.display === 'none';
  prev.classList.toggle('expanded', opening);
  edit.style.display = opening ? '' : 'none';
  if (opening) { const ta = document.getElementById('meta-' + id); if (ta) setTimeout(() => ta.focus(), 0); }
}

function mCharCount(id) {
  const ta = document.getElementById('meta-' + id);
  const cc = document.getElementById('mcc-' + id);
  if (ta && cc) cc.textContent = ta.value.length;
}

function saveMEdit(id) {
  const ta = document.getElementById('meta-' + id);
  const v = matrixVariants.find(x => x.id === id);
  if (!ta || !v) return;
  v.content = ta.value;
  v.charCount = ta.value.length;
  const prev = document.getElementById('mprev-' + id);
  if (prev) { prev.innerHTML = escHtml(v.content); prev.classList.remove('expanded'); }
  const edit = document.getElementById('medit-' + id);
  if (edit) edit.style.display = 'none';
  const cc = document.getElementById('mcc-' + id);
  if (cc) cc.textContent = v.charCount;
}

function cancelMEdit(id) {
  const v = matrixVariants.find(x => x.id === id);
  const ta = document.getElementById('meta-' + id);
  if (ta && v) ta.value = v.content;
  const edit = document.getElementById('medit-' + id);
  if (edit) edit.style.display = 'none';
  const prev = document.getElementById('mprev-' + id);
  if (prev) prev.classList.remove('expanded');
}

async function regenVariant(id) {
  const v = matrixVariants.find(x => x.id === id);
  if (!v || !pw) return;
  const btn = document.querySelector('#mrow-' + id + ' .btn');
  if (btn) { btn.textContent = '…'; btn.disabled = true; }
  try {
    const suffix = v.type === 'soft' ? '\n\n（更完整的我放在主頁）' : v.type === 'explicit' ? '\n\n追蹤 @yusheng.zhu.14' : '';
    const baseText = v.content.endsWith(suffix.trim()) ? v.content.slice(0, v.content.length - suffix.length).trim() : v.content;
    const prompt = '請針對主題「' + matrixTopic + '」，重新產出一篇全新的 Threads 貼文。\n\n' +
      '參考切角（請用不同切角）：\n' + baseText + '\n\n' +
      '要求：純文字，60-120 字，嚴禁出現任何連結，結尾不加導流語句。\n只輸出文案本身，不要有說明。';
    const text = await callGPT(prompt, SOP_SYSTEM, 800);
    const cleaned = stripLinks(text.trim());
    v.content = cleaned + suffix;
    v.charCount = v.content.length;
    const prev = document.getElementById('mprev-' + id);
    if (prev) prev.innerHTML = escHtml(v.content);
    const ta = document.getElementById('meta-' + id);
    if (ta) ta.value = v.content;
    const cc = document.getElementById('mcc-' + id);
    if (cc) cc.textContent = v.charCount;
  } catch (e) {
    alert('重新產出失敗：' + e.message);
  } finally {
    if (btn) { btn.textContent = '重產'; btn.disabled = false; }
  }
}

function exportMatrixExcel() {
  if (!matrixVariants.length) { alert('尚未產出任何文案'); return; }
  if (typeof XLSX === 'undefined') { alert('SheetJS 載入中，請稍後再試'); return; }
  const wb = XLSX.utils.book_new();
  const rows = [['帳號編號', '發文時間', '文案內容', '導流類型', '主題', '字數']];
  matrixVariants.forEach((v, i) => {
    rows.push([String(i + 1).padStart(3, '0'), '', v.content, v.typeLabel, matrixTopic, v.charCount]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 10 }, { wch: 12 }, { wch: 60 }, { wch: 10 }, { wch: 20 }, { wch: 8 }];
  XLSX.utils.book_append_sheet(wb, ws, '批量矩陣');
  const d = new Date();
  const ds = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  XLSX.writeFile(wb, '批量矩陣_' + matrixTopic + '_' + ds + '.xlsx');
}

// ===== BIO GENERATION =====
async function generateBios() {
  if (!pw) { alert('請先輸入密碼並按「載入」'); return; }
  const progEl = document.getElementById('bio-progress');
  const progBar = document.getElementById('bio-prog-bar');
  const progText = document.getElementById('bio-prog-text');
  const resultsEl = document.getElementById('bio-results');
  progEl.style.display = '';
  resultsEl.style.display = 'none';
  progBar.style.width = '0%';
  progText.textContent = '產出中…';
  const genBtn = document.getElementById('bio-gen-btn');
  genBtn.disabled = true;
  genBtn.textContent = '產出中…';

  const bioSys = '你是 @yusheng.zhu.14（Gino）的社群帳號 Bio 文案助手。\n' +
    'Gino 是黃金日內交易講師，有 2.5 年交易經驗，品牌名稱「重心開始」。\n\n' +
    '【規則】\n' +
    '- 每個 Bio 不超過 3 行，語言自然口語，貼近台灣用語\n' +
    '- 結尾統一用「群連結 👇」四個字結尾（不寫實際網址）\n' +
    '- 嚴禁出現：保證獲利、穩賺、必賺、零風險、保本、賣課\n' +
    '- 嚴禁出現任何實際連結（http://、https:// 等）\n' +
    '- 不要出現免責聲明';

  const batches = [
    { start: 1,  count: 35, styles: '簡潔專業7個、親切口語7個、痛點切入7個、結果導向7個、簡短個性7個' },
    { start: 36, count: 35, styles: '簡潔專業7個、親切口語7個、痛點切入7個、結果導向7個、簡短個性7個' },
    { start: 71, count: 30, styles: '簡潔專業6個、親切口語6個、痛點切入6個、結果導向6個、簡短個性6個' },
  ];

  bioResults = [];
  try {
    for (let b = 0; b < batches.length; b++) {
      const { start, count, styles } = batches[b];
      progText.textContent = '產出中 ' + bioResults.length + '/100…';
      progBar.style.width = bioResults.length + '%';

      let bioFmt = '';
      for (let k = 0; k < count; k++) bioFmt += '===' + (start + k) + '===\n（Bio ' + (start + k) + '，最多3行，結尾要有「群連結 👇」）\n';

      const bioPrompt = '請產出 ' + count + ' 個不同的 Threads 帳號 Bio，編號從 ' + start + ' 到 ' + (start + count - 1) + '。\n\n' +
        '風格分配：' + styles + '\n\n' +
        '風格說明：\n1. 簡潔專業：如「黃金交易日常紀錄」\n' +
        '2. 親切口語：如「做黃金的普通人」\n' +
        '3. 痛點切入：如「以前也是看盤看到崩潰」\n' +
        '4. 結果導向：如「兩年交易心得整理」\n' +
        '5. 簡短個性：如「交易 × 生活」\n\n' +
        '輸出格式（嚴格按照，不要有其他說明文字）：\n' + bioFmt;

      const bioText = await callGPT(bioPrompt, bioSys, 4000);
      let bios = parseDelimited(bioText);
      while (bios.length < count) bios.push(bios[0] || '黃金交易日常紀錄\n群連結 👇');
      bios = bios.slice(0, count);

      bios.forEach((raw, i) => {
        let text = stripLinks(raw.trim());
        if (hasBannedWord(text)) text = cleanBannedWords(text);
        bioResults.push({ id: start + i, content: text, charCount: text.length });
      });
    }
    progBar.style.width = '100%';
    progText.textContent = '✓ 完成！共 ' + bioResults.length + ' 個 Bio';
    renderBioTable();
    resultsEl.style.display = '';
    resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    progText.textContent = '❌ 產出失敗：' + e.message;
    console.error('[bio]', e);
  } finally {
    genBtn.disabled = false;
    genBtn.textContent = '✦ 產出 100 個 Bio';
  }
}

function renderBioTable() {
  const tbody = document.getElementById('bio-tbody');
  if (!tbody) return;
  tbody.innerHTML = bioResults.map(b =>
    '<tr>' +
      '<td style="width:36px;text-align:center;font-size:11px;color:var(--text-muted)">' + String(b.id).padStart(3, '0') + '</td>' +
      '<td style="white-space:pre-line;font-size:13px;line-height:1.7">' + escHtml(b.content) + '</td>' +
      '<td style="width:36px;text-align:center;font-size:11px;color:var(--text-muted)">' + b.charCount + '</td>' +
    '</tr>'
  ).join('');
}

function exportBioExcel() {
  if (!bioResults.length) { alert('尚未產出任何 Bio'); return; }
  if (typeof XLSX === 'undefined') { alert('SheetJS 載入中，請稍後再試'); return; }
  const groupLink = (document.getElementById('bio-group-link')?.value || '').trim();
  const wb = XLSX.utils.book_new();
  const rows = [['帳號編號', 'Bio 文字', '群連結']];
  bioResults.forEach(b => rows.push([String(b.id).padStart(3, '0'), b.content, groupLink]));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 10 }, { wch: 50 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Bio批量');
  const d = new Date();
  const ds = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  XLSX.writeFile(wb, 'Bio批量_' + ds + '.xlsx');
}
