<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>課程閱讀</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-500: #6b7280;
    --gray-900: #111827;
    --danger: #dc2626;
    --shadow: 0 1px 4px rgba(0,0,0,.12);
  }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gray-100);
    color: var(--gray-900);
    min-height: 100vh;
    /* 停用文字選取，提高轉傳成本 */
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  /* 列印也印不出內容 */
  @media print {
    body { display: none !important; }
  }

  /* 後台預覽（admin 模式）：管理者自用，取消選取限制與列印封鎖 */
  html.admin-mode, html.admin-mode body {
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
  }
  @media print {
    html.admin-mode body { display: block !important; }
  }

  .topbar { background: var(--primary); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .back-btn { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: .8rem; font-weight: 700; padding: 6px 10px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
  .back-btn:hover { background: rgba(255,255,255,.28); }
  .title-text { font-size: .92rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress-text { font-size: .78rem; opacity: .85; flex-shrink: 0; }

  .zoom-controls { display: flex; align-items: center; gap: 6px; }
  .zoom-btn { background: rgba(255,255,255,.18); border: none; color: #fff; width: 26px; height: 26px; border-radius: 6px; font-size: .95rem; font-weight: 700; cursor: pointer; line-height: 1; flex-shrink: 0; }
  .zoom-btn:hover { background: rgba(255,255,255,.28); }
  .zoom-label { font-size: .78rem; opacity: .9; min-width: 36px; text-align: center; flex-shrink: 0; }

  /* 外層固定寬度、負責橫向捲動；.viewer 本身依內容寬度伸縮（縮放後會比外層寬，靠外層捲動看到完整內容） */
  .viewer-scroll { max-width: 1360px; margin: 20px auto; padding: 0 12px 40px; overflow-x: auto; }
  .viewer { min-width: 100%; width: max-content; display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .page-wrap { position: relative; box-shadow: var(--shadow); background: #fff; line-height: 0; margin: 0 auto; flex-shrink: 0; }
  .page-wrap canvas { display: block; }

  .watermark-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-repeat: repeat;
  }

  /* 上一篇 / 下一篇 */
  .reader-nav { max-width: 1360px; margin: 14px auto 0; padding: 0 12px; display: flex; justify-content: space-between; gap: 10px; }
  .reader-nav.bottom { margin: 0 auto 40px; }
  .nav-btn { flex: 1; min-width: 0; max-width: 48%; background: #fff; border: 1px solid var(--gray-200); border-radius: 10px; padding: 10px 14px; font-size: .85rem; color: var(--gray-900); cursor: pointer; box-shadow: var(--shadow); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-btn.next { text-align: right; }
  .nav-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .nav-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .nav-btn .nav-label { display: block; font-size: .72rem; color: var(--gray-500); margin-bottom: 2px; }
  .done-badge { font-size: .75rem; font-weight: 700; background: #d1fae5; color: #065f46; padding: 3px 8px; border-radius: 999px; flex-shrink: 0; }

  /* 課後小測驗：看完（捲到底）才出現，答完立即顯示對錯與解釋 */
  .quiz { max-width: 760px; margin: 0 auto 20px; padding: 0 12px; }
  .quiz-card { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 16px; }
  .quiz-card h2 { font-size: .95rem; margin-bottom: 4px; }
  .quiz-sub { font-size: .78rem; color: var(--gray-500); margin-bottom: 12px; }
  .quiz-q { border-top: 1px solid var(--gray-100); padding: 12px 0; }
  .quiz-q-title { font-size: .9rem; font-weight: 700; margin-bottom: 8px; line-height: 1.5; }
  .quiz-opt { display: block; width: 100%; text-align: left; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; font-size: .86rem; color: var(--gray-900); cursor: pointer; line-height: 1.5; }
  .quiz-opt:hover:not(:disabled) { border-color: var(--primary); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-opt.correct { background: #d1fae5; border-color: #10b981; color: #065f46; font-weight: 700; }
  .quiz-opt.wrong   { background: #fee2e2; border-color: #f87171; color: #991b1b; }
  .quiz-feedback { font-size: .84rem; line-height: 1.6; border-radius: 8px; padding: 9px 12px; margin-top: 4px; }
  .quiz-feedback.ok  { background: #ecfdf5; color: #065f46; }
  .quiz-feedback.bad { background: #fef2f2; color: #991b1b; }
  .quiz-retry { background: none; border: none; color: var(--primary); font-weight: 700; font-size: .82rem; cursor: pointer; padding: 6px 0 0; }
  .quiz-summary { font-size: .88rem; font-weight: 700; padding-top: 10px; border-top: 1px solid var(--gray-100); }

  .status { text-align: center; padding: 60px 20px; color: var(--gray-500); font-size: .9rem; }
  .status.error { color: var(--danger); }
</style>
<script>
  // 後台預覽模式：盡早掛上 class，讓 user-select / 列印 CSS 生效
  if (new URLSearchParams(location.search).get('admin') === '1') {
    document.documentElement.classList.add('admin-mode');
  }
</script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn" onclick="location.href='/course.html'">← 返回</button>
    <div class="title-text" id="title-text">載入中…</div>
  </div>
  <div class="topbar-right">
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="changeZoom(-0.2)" aria-label="縮小">－</button>
      <span id="zoom-label" class="zoom-label">100%</span>
      <button class="zoom-btn" onclick="changeZoom(0.2)" aria-label="放大">＋</button>
    </div>
    <div class="progress-text" id="progress-text"></div>
    <span class="done-badge" id="done-badge" style="display:none">✓ 已看完</span>
  </div>
</div>

<div class="reader-nav" id="nav-top" style="display:none"></div>

<div class="viewer-scroll" id="viewer-scroll">
  <div class="viewer" id="viewer">
    <div class="status" id="status">載入中…</div>
  </div>
</div>

<div class="quiz" id="quiz" style="display:none"></div>

<div class="reader-nav bottom" id="nav-bottom" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const qs = sel => document.querySelector(sel);
  const params = new URLSearchParams(location.search);
  const pdfId = params.get('id');
  const adminMode = params.get('admin') === '1';   // 後台預覽：乾淨檢視、不套防護
  const adminKey = params.get('key') || '';

  let currentPdf = null;
  let currentZoom = 1;
  let renderGeneration = 0;

  // 觀看進度：捲到最後一頁（底部哨兵進入畫面）才標記已看完；後台預覽不記錄
  let isCompleted = false;
  let completeSending = false;
  let endObserver = null;

  // ── 防護措施（盡力而為，重點是提高轉傳成本）；後台預覽模式不套用 ──
  if (!adminMode) {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (key === 'p' || key === 's')) {
        e.preventDefault();
      }
    });
    document.addEventListener('dragstart', e => e.preventDefault());
  }

  // ── 縮放：改變 currentZoom 後一律重新 render，不用 CSS 放大既有 canvas ──
  function updateZoomLabel() {
    const label = qs('#zoom-label');
    if (label) label.textContent = Math.round(currentZoom * 100) + '%';
  }

  async function setZoom(newZoom) {
    const clamped = Math.min(3, Math.max(0.5, newZoom));
    if (Math.abs(clamped - currentZoom) < 0.001) return;
    currentZoom = clamped;
    updateZoomLabel();
    await renderAllPages();
  }

  function changeZoom(delta) {
    setZoom(currentZoom + delta);
  }

  // Ctrl + 滾輪（含觸控板 pinch 在多數瀏覽器上會回報為 wheel + ctrlKey）
  window.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    changeZoom(e.deltaY > 0 ? -0.1 : 0.1);
  }, { passive: false });

  // 觸控 pinch：手勢過程中只記錄比例，放開手指才真正重新 render（避免每個 move 都重繪）
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  let pinchLiveZoom = 1;
  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = touchDist(e.touches);
      pinchStartZoom = currentZoom;
      pinchLiveZoom = currentZoom;
    }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      const ratio = touchDist(e.touches) / pinchStartDist;
      pinchLiveZoom = Math.min(3, Math.max(0.5, pinchStartZoom * ratio));
    }
  }, { passive: false });
  document.addEventListener('touchend', e => {
    if (pinchStartDist && e.touches.length < 2) {
      pinchStartDist = null;
      setZoom(pinchLiveZoom);
    }
  }, { passive: true });

  // 視窗尺寸改變時重新以新的容器寬度 fit-to-width 並重繪
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (currentPdf) renderAllPages(); }, 300);
  });

  function buildWatermarkDataUri(text) {
    const safe = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'>
      <text x='40' y='280' font-size='22' fill='rgba(90,90,90,0.08)' font-family='sans-serif' transform='rotate(-30 260 260)'>${safe}</text>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  const BRAND_WATERMARK_URL = buildWatermarkDataUri('重心開始');

  async function init() {
    const statusEl = qs('#status');
    if (!pdfId) {
      statusEl.textContent = '缺少 PDF 編號';
      statusEl.classList.add('error');
      return;
    }

    if (!adminMode) {
      try {
        await fetchJson('/api/course/me');
      } catch (e) {
        location.href = '/course-login.html';
        return;
      }
      loadNavAndProgress(); // 不阻塞 PDF 載入
    } else {
      const backBtn = qs('.back-btn');
      if (backBtn) { backBtn.textContent = '關閉'; backBtn.onclick = () => window.close(); }
    }

    const fileUrl = adminMode
      ? '/api/course/admin/pdfs/' + encodeURIComponent(pdfId) + '/file?key=' + encodeURIComponent(adminKey)
      : '/api/course/pdf/' + encodeURIComponent(pdfId) + '/file';

    let fileBuf;
    try {
      const resp = await fetch(fileUrl, { credentials: 'same-origin' });
      if (!resp.ok) {
        const errMsg = resp.status === 403 ? (adminMode ? '主管權限驗證失敗' : '沒有這份 PDF 的閱讀權限')
          : resp.status === 404 ? '檔案不存在'
          : '載入失敗';
        throw new Error(errMsg);
      }
      fileBuf = await resp.arrayBuffer();
    } catch (e) {
      statusEl.textContent = e.message || '載入失敗';
      statusEl.classList.add('error');
      return;
    }

    try {
      currentPdf = await pdfjsLib.getDocument({ data: fileBuf }).promise;
      if (!titleFromList) qs('#title-text').textContent = params.get('t') || (adminMode ? '後台預覽' : '課程閱讀');
      statusEl.textContent = '';
      updateZoomLabel();
      await renderAllPages();
    } catch (e) {
      statusEl.textContent = 'PDF 解析失敗：' + e.message;
      statusEl.classList.add('error');
    }
  }

  // 依 currentZoom 重新 render 全部頁面（縮放一律重繪，不用 CSS 拉大既有 canvas）
  async function renderAllPages() {
    if (!currentPdf) return;
    const myGeneration = ++renderGeneration;

    const viewerEl = qs('#viewer');
    const progressEl = qs('#progress-text');
    viewerEl.innerHTML = '';

    // 基礎顯示寬度以「外層固定寬度捲動容器」為準（不能量測 .viewer 自己，它的寬度會隨縮放後的內容變動）
    const scrollEl = qs('#viewer-scroll');
    const cs = getComputedStyle(scrollEl);
    const paddingX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const containerWidth = Math.max(100, scrollEl.clientWidth - paddingX);
    const outputScale = Math.min(window.devicePixelRatio || 1, 2);

    for (let pageNum = 1; pageNum <= currentPdf.numPages; pageNum++) {
      if (myGeneration !== renderGeneration) return; // 縮放又觸發了新的 render，放棄這次舊的
      progressEl.textContent = `渲染中 ${pageNum}/${currentPdf.numPages}`;
      const page = await currentPdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const fitScale = containerWidth / baseViewport.width;
      const displayScale = fitScale * currentZoom;

      // displayViewport：CSS 顯示尺寸；renderViewport：實際繪製的像素尺寸（含裝置像素密度）
      const displayViewport = page.getViewport({ scale: displayScale });
      const renderViewport = page.getViewport({ scale: displayScale * outputScale });

      const canvas = document.createElement('canvas');
      canvas.width = renderViewport.width;
      canvas.height = renderViewport.height;
      canvas.style.width = displayViewport.width + 'px';
      canvas.style.height = displayViewport.height + 'px';
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;

      if (myGeneration !== renderGeneration) return;

      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      wrap.style.width = displayViewport.width + 'px';
      wrap.style.height = displayViewport.height + 'px';
      wrap.appendChild(canvas);

      if (!adminMode) {
        const overlay = document.createElement('div');
        overlay.className = 'watermark-overlay';
        overlay.style.backgroundImage = `url("${BRAND_WATERMARK_URL}")`;
        wrap.appendChild(overlay);
      }

      viewerEl.appendChild(wrap);
    }

    if (myGeneration === renderGeneration) {
      progressEl.textContent = `共 ${currentPdf.numPages} 頁`;
      observeEnd(viewerEl);
    }
  }

  // ── 上一篇 / 下一篇（依 /my-pdfs 的閱讀順序：系列順序 → 篇號；跨系列自動接續）──
  let titleFromList = false;

  async function loadNavAndProgress() {
    try {
      const [list, progress] = await Promise.all([
        fetchJson('/api/course/my-pdfs'),
        fetchJson('/api/course/progress').catch(() => ({ pdf_ids: [] })),
      ]);
      const curId = Number(pdfId);
      if ((progress.pdf_ids || []).includes(curId)) setCompleted();

      const idx = list.findIndex(p => p.id === curId);
      if (idx === -1) return;
      const cur = list[idx];
      titleFromList = true;
      qs('#title-text').textContent = cur.series_name ? `${cur.series_name}｜${cur.title}` : cur.title;
      renderNav(idx > 0 ? list[idx - 1] : null, idx < list.length - 1 ? list[idx + 1] : null);
    } catch (e) {
      // 導覽載入失敗不影響閱讀
    }
  }

  function navBtnHtml(item, dir) {
    const isPrev = dir === 'prev';
    if (!item) {
      return `<button class="nav-btn ${dir}" disabled><span class="nav-label">${isPrev ? '上一篇' : '下一篇'}</span>${isPrev ? '已是第一篇' : '已是最後一篇'}</button>`;
    }
    const label = isPrev ? '← 上一篇' : '下一篇 →';
    const name = (item.series_name ? item.series_name + '｜' : '') + item.title;
    return `<button class="nav-btn ${dir}" onclick="goToPdf(${item.id})" title="${escAttr(name)}"><span class="nav-label">${label}</span>${escAttr(name)}</button>`;
  }

  function renderNav(prev, next) {
    const html = navBtnHtml(prev, 'prev') + navBtnHtml(next, 'next');
    for (const id of ['#nav-top', '#nav-bottom']) {
      const el = qs(id);
      el.innerHTML = html;
      el.style.display = '';
    }
  }

  function goToPdf(id) {
    location.href = '/course-reader.html?id=' + encodeURIComponent(id);
  }

  function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── 看完偵測：在最後一頁後面放一個哨兵，進入畫面 = 已捲到最後一頁底部 ──
  function observeEnd(viewerEl) {
    if (adminMode || isCompleted || !('IntersectionObserver' in window)) return;
    if (endObserver) endObserver.disconnect();
    const sentinel = document.createElement('div');
    sentinel.style.cssText = 'width:1px;height:1px';
    viewerEl.appendChild(sentinel);
    endObserver = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) markCompleted();
    });
    endObserver.observe(sentinel);
  }

  function setCompleted() {
    isCompleted = true;
    qs('#done-badge').style.display = '';
    if (endObserver) { endObserver.disconnect(); endObserver = null; }
    loadQuiz();
  }

  async function markCompleted() {
    if (isCompleted || completeSending) return;
    completeSending = true;
    try {
      const r = await fetch('/api/course/progress', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pdf_id: Number(pdfId) }),
      });
      if (r.ok) setCompleted();
    } catch (e) {
      // 網路失敗：下次再捲到底會重試
    } finally {
      completeSending = false;
    }
  }

  // ── 課後小測驗：看完後出現；答錯不公布正解，讓學員再想一次 ──
  let quizState = null; // { questions: [{ id, question, options, last, retrying }] }

  async function loadQuiz() {
    if (adminMode || quizState) return;
    quizState = { questions: [] };
    try {
      const data = await fetchJson('/api/course/quiz/' + encodeURIComponent(pdfId));
      quizState.questions = data.questions || [];
      renderQuiz();
    } catch (e) {
      // 測驗載入失敗不影響閱讀
    }
  }

  function renderQuiz() {
    const el = qs('#quiz');
    const list = quizState.questions;
    if (!list.length) { el.style.display = 'none'; return; }
    const answered = list.filter(q => q.last).length;
    const correct = list.filter(q => q.last && q.last.is_correct).length;

    el.innerHTML = `<div class="quiz-card">
      <h2>✏️ 小測驗（${list.length} 題）</h2>
      <div class="quiz-sub">看完了，用 ${list.length} 題確認自己有沒有抓到重點。答錯可以再試。</div>
      ${list.map((q, qi) => quizQuestionHtml(q, qi)).join('')}
      ${answered === list.length ? `<div class="quiz-summary">${list.length} 題答對 ${correct} 題${correct === list.length ? '，全部答對 👍' : '，答錯的題目可以再試一次'}</div>` : ''}
    </div>`;
    el.style.display = '';
  }

  function quizQuestionHtml(q, qi) {
    const last = q.retrying ? null : q.last;
    const opts = q.options.map((o, oi) => {
      let cls = '';
      if (last && oi === last.chosen_index) cls = last.is_correct ? 'correct' : 'wrong';
      return `<button class="quiz-opt ${cls}" ${last ? 'disabled' : ''} onclick="answerQuiz(${qi}, ${oi})">${escAttr(o)}</button>`;
    }).join('');
    let feedback = '';
    if (last) {
      const exp = last.explanation ? `<br>${escAttr(last.explanation)}` : '';
      feedback = last.is_correct
        ? `<div class="quiz-feedback ok">✓ 答對了${exp}</div>`
        : `<div class="quiz-feedback bad">✗ 答錯了，再想想看${exp}</div><button class="quiz-retry" onclick="retryQuiz(${qi})">再試一次</button>`;
    }
    return `<div class="quiz-q"><div class="quiz-q-title">${qi + 1}. ${escAttr(q.question)}</div>${opts}${feedback}</div>`;
  }

  async function answerQuiz(qi, oi) {
    const q = quizState.questions[qi];
    if (!q || (q.last && !q.retrying)) return;
    try {
      const r = await fetch('/api/course/quiz/' + encodeURIComponent(pdfId) + '/answer', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question_id: q.id, chosen_index: oi }),
      });
      if (!r.ok) throw new Error(String(r.status));
      const res = await r.json();
      q.last = { chosen_index: oi, is_correct: res.is_correct, explanation: res.explanation, correct_index: res.correct_index };
      q.retrying = false;
      renderQuiz();
    } catch (e) {
      alert('送出失敗，請再試一次');
    }
  }

  function retryQuiz(qi) {
    quizState.questions[qi].retrying = true;
    renderQuiz();
  }

  async function fetchJson(path) {
    const r = await fetch(path, { credentials: 'same-origin' });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }

  init();
</script>
</body>
