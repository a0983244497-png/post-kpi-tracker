<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>課程閱讀</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-500: #6b7280;
    --gray-900: #111827;
    --danger: #dc2626;
    --shadow: 0 1px 4px rgba(0,0,0,.12);
  }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gray-100);
    color: var(--gray-900);
    min-height: 100vh;
    /* 停用文字選取，提高轉傳成本 */
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  /* 列印也印不出內容 */
  @media print {
    body { display: none !important; }
  }

  /* 後台預覽（admin 模式）：管理者自用，取消選取限制與列印封鎖 */
  html.admin-mode, html.admin-mode body {
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
  }
  @media print {
    html.admin-mode body { display: block !important; }
  }

  .topbar { background: var(--primary); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .back-btn { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: .8rem; font-weight: 700; padding: 6px 10px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
  .back-btn:hover { background: rgba(255,255,255,.28); }
  .title-text { font-size: .92rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress-text { font-size: .78rem; opacity: .85; flex-shrink: 0; }

  .zoom-controls { display: flex; align-items: center; gap: 6px; }
  .zoom-btn { background: rgba(255,255,255,.18); border: none; color: #fff; width: 26px; height: 26px; border-radius: 6px; font-size: .95rem; font-weight: 700; cursor: pointer; line-height: 1; flex-shrink: 0; }
  .zoom-btn:hover { background: rgba(255,255,255,.28); }
  .zoom-label { font-size: .78rem; opacity: .9; min-width: 36px; text-align: center; flex-shrink: 0; }

  /* 外層固定寬度、負責橫向捲動；.viewer 本身依內容寬度伸縮（縮放後會比外層寬，靠外層捲動看到完整內容） */
  .viewer-scroll { max-width: 1360px; margin: 20px auto; padding: 0 12px 40px; overflow-x: auto; }
  .viewer { min-width: 100%; width: max-content; display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .page-wrap { position: relative; box-shadow: var(--shadow); background: #fff; line-height: 0; margin: 0 auto; flex-shrink: 0; }
  .page-wrap canvas { display: block; }

  .watermark-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-repeat: repeat;
  }

  .status { text-align: center; padding: 60px 20px; color: var(--gray-500); font-size: .9rem; }
  .status.error { color: var(--danger); }
</style>
<script>
  // 後台預覽模式：盡早掛上 class，讓 user-select / 列印 CSS 生效
  if (new URLSearchParams(location.search).get('admin') === '1') {
    document.documentElement.classList.add('admin-mode');
  }
</script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn" onclick="location.href='/course.html'">← 返回</button>
    <div class="title-text" id="title-text">載入中…</div>
  </div>
  <div class="topbar-right">
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="changeZoom(-0.2)" aria-label="縮小">－</button>
      <span id="zoom-label" class="zoom-label">100%</span>
      <button class="zoom-btn" onclick="changeZoom(0.2)" aria-label="放大">＋</button>
    </div>
    <div class="progress-text" id="progress-text"></div>
  </div>
</div>

<div class="viewer-scroll" id="viewer-scroll">
  <div class="viewer" id="viewer">
    <div class="status" id="status">載入中…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const qs = sel => document.querySelector(sel);
  const params = new URLSearchParams(location.search);
  const pdfId = params.get('id');
  const adminMode = params.get('admin') === '1';   // 後台預覽：乾淨檢視、不套防護
  const adminKey = params.get('key') || '';

  let currentPdf = null;
  let currentZoom = 1;
  let renderGeneration = 0;

  // ── 防護措施（盡力而為，重點是提高轉傳成本）；後台預覽模式不套用 ──
  if (!adminMode) {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (key === 'p' || key === 's')) {
        e.preventDefault();
      }
    });
    document.addEventListener('dragstart', e => e.preventDefault());
  }

  // ── 縮放：改變 currentZoom 後一律重新 render，不用 CSS 放大既有 canvas ──
  function updateZoomLabel() {
    const label = qs('#zoom-label');
    if (label) label.textContent = Math.round(currentZoom * 100) + '%';
  }

  async function setZoom(newZoom) {
    const clamped = Math.min(3, Math.max(0.5, newZoom));
    if (Math.abs(clamped - currentZoom) < 0.001) return;
    currentZoom = clamped;
    updateZoomLabel();
    await renderAllPages();
  }

  function changeZoom(delta) {
    setZoom(currentZoom + delta);
  }

  // Ctrl + 滾輪（含觸控板 pinch 在多數瀏覽器上會回報為 wheel + ctrlKey）
  window.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    changeZoom(e.deltaY > 0 ? -0.1 : 0.1);
  }, { passive: false });

  // 觸控 pinch：手勢過程中只記錄比例，放開手指才真正重新 render（避免每個 move 都重繪）
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  let pinchLiveZoom = 1;
  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = touchDist(e.touches);
      pinchStartZoom = currentZoom;
      pinchLiveZoom = currentZoom;
    }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      const ratio = touchDist(e.touches) / pinchStartDist;
      pinchLiveZoom = Math.min(3, Math.max(0.5, pinchStartZoom * ratio));
    }
  }, { passive: false });
  document.addEventListener('touchend', e => {
    if (pinchStartDist && e.touches.length < 2) {
      pinchStartDist = null;
      setZoom(pinchLiveZoom);
    }
  }, { passive: true });

  // 視窗尺寸改變時重新以新的容器寬度 fit-to-width 並重繪
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (currentPdf) renderAllPages(); }, 300);
  });

  function buildWatermarkDataUri(text) {
    const safe = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'>
      <text x='40' y='280' font-size='22' fill='rgba(90,90,90,0.08)' font-family='sans-serif' transform='rotate(-30 260 260)'>${safe}</text>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  const BRAND_WATERMARK_URL = buildWatermarkDataUri('重心開始');

  async function init() {
    const statusEl = qs('#status');
    if (!pdfId) {
      statusEl.textContent = '缺少 PDF 編號';
      statusEl.classList.add('error');
      return;
    }

    if (!adminMode) {
      try {
        await fetchJson('/api/course/me');
      } catch (e) {
        location.href = '/course-login.html';
        return;
      }
    } else {
      const backBtn = qs('.back-btn');
      if (backBtn) { backBtn.textContent = '關閉'; backBtn.onclick = () => window.close(); }
    }

    const fileUrl = adminMode
      ? '/api/course/admin/pdfs/' + encodeURIComponent(pdfId) + '/file?key=' + encodeURIComponent(adminKey)
      : '/api/course/pdf/' + encodeURIComponent(pdfId) + '/file';

    let fileBuf;
    try {
      const resp = await fetch(fileUrl, { credentials: 'same-origin' });
      if (!resp.ok) {
        const errMsg = resp.status === 403 ? (adminMode ? '主管權限驗證失敗' : '沒有這份 PDF 的閱讀權限')
          : resp.status === 404 ? '檔案不存在'
          : '載入失敗';
        throw new Error(errMsg);
      }
      fileBuf = await resp.arrayBuffer();
    } catch (e) {
      statusEl.textContent = e.message || '載入失敗';
      statusEl.classList.add('error');
      return;
    }

    try {
      currentPdf = await pdfjsLib.getDocument({ data: fileBuf }).promise;
      qs('#title-text').textContent = params.get('t') || (adminMode ? '後台預覽' : '課程閱讀');
      statusEl.textContent = '';
      updateZoomLabel();
      await renderAllPages();
    } catch (e) {
      statusEl.textContent = 'PDF 解析失敗：' + e.message;
      statusEl.classList.add('error');
    }
  }

  // 依 currentZoom 重新 render 全部頁面（縮放一律重繪，不用 CSS 拉大既有 canvas）
  async function renderAllPages() {
    if (!currentPdf) return;
    const myGeneration = ++renderGeneration;

    const viewerEl = qs('#viewer');
    const progressEl = qs('#progress-text');
    viewerEl.innerHTML = '';

    // 基礎顯示寬度以「外層固定寬度捲動容器」為準（不能量測 .viewer 自己，它的寬度會隨縮放後的內容變動）
    const scrollEl = qs('#viewer-scroll');
    const cs = getComputedStyle(scrollEl);
    const paddingX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const containerWidth = Math.max(100, scrollEl.clientWidth - paddingX);
    const outputScale = Math.min(window.devicePixelRatio || 1, 2);

    for (let pageNum = 1; pageNum <= currentPdf.numPages; pageNum++) {
      if (myGeneration !== renderGeneration) return; // 縮放又觸發了新的 render，放棄這次舊的
      progressEl.textContent = `渲染中 ${pageNum}/${currentPdf.numPages}`;
      const page = await currentPdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const fitScale = containerWidth / baseViewport.width;
      const displayScale = fitScale * currentZoom;

      // displayViewport：CSS 顯示尺寸；renderViewport：實際繪製的像素尺寸（含裝置像素密度）
      const displayViewport = page.getViewport({ scale: displayScale });
      const renderViewport = page.getViewport({ scale: displayScale * outputScale });

      const canvas = document.createElement('canvas');
      canvas.width = renderViewport.width;
      canvas.height = renderViewport.height;
      canvas.style.width = displayViewport.width + 'px';
      canvas.style.height = displayViewport.height + 'px';
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;

      if (myGeneration !== renderGeneration) return;

      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      wrap.style.width = displayViewport.width + 'px';
      wrap.style.height = displayViewport.height + 'px';
      wrap.appendChild(canvas);

      if (!adminMode) {
        const overlay = document.createElement('div');
        overlay.className = 'watermark-overlay';
        overlay.style.backgroundImage = `url("${BRAND_WATERMARK_URL}")`;
        wrap.appendChild(overlay);
      }

      viewerEl.appendChild(wrap);
    }

    if (myGeneration === renderGeneration) {
      progressEl.textContent = `共 ${currentPdf.numPages} 頁`;
    }
  }

  async function fetchJson(path) {
    const r = await fetch(path, { credentials: 'same-origin' });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }

  init();
</script>
</body>
</html>
